name: Apply Salary Manager 3.9.3 r5

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-salary-manager-3.9.3-r5.yml"

permissions:
  contents: write

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply Salary Manager fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          OLD_RELEASE = "3.9.3-targeted-preview-statement-r4"
          NEW_RELEASE = "3.9.3-shortcuts-merchant-preview-r5"

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          config_path = "public/config.js"
          config = read(config_path)
          marker = "// Salary Manager official iCloud Shortcut templates (3.9.3 r5)"
          defaults = (
              "\n\n" + marker + "\n"
              'window.SALARY_BANK_SHORTCUT_URL = "https://www.icloud.com/shortcuts/4fb8157133ba4255b689afa883cb3a3c";\n'
              'window.SALARY_WALLET_SHORTCUT_URL = "https://www.icloud.com/shortcuts/503d528339174d3dbf69cc09eb61169a";\n'
          )
          if marker not in config:
              config = config.rstrip() + defaults
          write(config_path, config)

          index_path = "public/index.html"
          index = read(index_path)
          index = index.replace(OLD_RELEASE, NEW_RELEASE)

          old_intro = '<p>استخرج رمزك الخاص مرة واحدة، ثم استخدم الزر المناسب لفتح تطبيق Shortcuts. سيُنسخ رمز الربط تلقائيًا؛ ضعه في خانة <b>shortcutToken</b>. بعد إكمال الربط مرة واحدة سيبقى ثابتًا ولا تحتاج لإعادته مع كل عملية.</p>'
          new_intro = '<p>اختر نوع الربط وسيتم نسخ رمز حسابك وفتح القالب الرسمي الجاهز تلقائيًا. أثناء تثبيت القالب ألصق الرمز فقط؛ الرابط وPOST وJSON معدّة مسبقًا. بعد ذلك أنشئ Personal Automation واختر مرسل البنك أو بطاقتك فقط.</p>'
          if old_intro in index:
              index = index.replace(old_intro, new_intro, 1)

          old_template_assign = '''          automationBankShortcutUrl = String(data.bankUrl || "");
                    automationWalletShortcutUrl = String(data.walletUrl || "");'''
          new_template_assign = '''          automationBankShortcutUrl = String(data.bankUrl || window.SALARY_BANK_SHORTCUT_URL || "");
                    automationWalletShortcutUrl = String(data.walletUrl || window.SALARY_WALLET_SHORTCUT_URL || "");'''
          if old_template_assign in index:
              index = index.replace(old_template_assign, new_template_assign, 1)

          shortcut_pattern = re.compile(
              r'''        var source = type === "wallet" \? "wallet" : "bank_message";\n'''
              r'''        var hint = \$\("#automationSetupHint"\);\n'''
              r'''        if \(hint\) \{\n'''
              r'''          hint\.classList\.add\("on"\);\n'''
              r'''          hint\.innerHTML = 'تم نسخ رمزك\. في Shortcuts ضعه في خانة <b>shortcutToken</b>، واجعل <b>source = ' \+ source \+ '</b>\. الربط يتم مرة واحدة فقط\.';\n'''
              r'''        \}\n'''
              r'''        try \{ await navigator\.clipboard\.writeText\(automationShortcutToken\); \}\n'''
              r'''        catch \(_\) \{ showToast\("تعذر نسخ الرمز تلقائيًا؛ انسخه من الحقل قبل المتابعة\.", true\); return; \}\n'''
              r'''        var configured = automationConfiguredShortcutUrl\(type\);\n'''
              r'''        showToast\(configured \? "تم نسخ رمزك · جارٍ فتح الاختصار الجاهز" : "تم نسخ رمزك · جارٍ فتح Shortcuts"\);\n'''
              r'''        setTimeout\(function \(\) \{\n'''
              r'''          try \{ window\.location\.href = configured \|\| "shortcuts://create-shortcut"; \}\n'''
              r'''          catch \(_\) \{ window\.open\(configured \|\| "shortcuts://", "_blank"\); \}\n'''
              r'''        \}, 350\);'''
          )
          shortcut_replacement = '''        var source = type === "wallet" ? "wallet" : "bank_message";
                  var configured = automationConfiguredShortcutUrl(type);
                  if (!configured) {
                    showToast("القالب الرسمي غير متوفر حاليًا. حاول مرة أخرى بعد تحديث الصفحة.", true);
                    return;
                  }
                  var hint = $("#automationSetupHint");
                  if (hint) {
                    hint.classList.add("on");
                    hint.innerHTML = type === "wallet"
                      ? '<b>Apple Wallet:</b> ثبّت القالب وألصق رمز الربط المنسوخ عند السؤال. بعدها: Shortcuts ← Automation ← Transaction ← اختر بطاقتك ← Run Immediately. داخل الأتمتة أنشئ Text يحتوي <b>amount:</b> ثم Amount و<b>merchant:</b> ثم Merchant، وبعده Run Shortcut واختر قالب مدير الراتب ومرّر له الـText.'
                      : '<b>رسائل البنك:</b> ثبّت القالب وألصق رمز الربط المنسوخ عند السؤال. بعدها: Shortcuts ← Automation ← Message ← اختر Sender الخاص بالبنك ← Run Immediately ← Run Shortcut واختر قالب مدير الراتب، ومرّر نص الرسالة كـInput.';
                  }
                  try { await navigator.clipboard.writeText(automationShortcutToken); }
                  catch (_) { showToast("تعذر نسخ الرمز تلقائيًا؛ انسخه من الحقل قبل المتابعة.", true); return; }
                  showToast("تم نسخ رمزك · جارٍ فتح القالب الرسمي الجاهز");
                  setTimeout(function () {
                    try { window.location.href = configured; }
                    catch (_) { window.open(configured, "_blank"); }
                  }, 350);'''
          if shortcut_pattern.search(index):
              index = shortcut_pattern.sub(shortcut_replacement, index, count=1)
          elif "القالب الرسمي غير متوفر حاليًا" not in index:
              raise SystemExit("Patch failed: prepareShortcutAssistant block not found")

          old_connection = '            connection.textContent = status.enabled ? "الربط مفعّل لهذا الحساب ولا يحتاج إعادة ربط" + (status.lastUsedAt ? " · آخر استقبال " + formatDateTimeCompact(status.lastUsedAt) : "") : "الربط غير مفعّل. استخرج رمز ربط أولًا.";'
          new_connection = '''            connection.textContent = status.enabled
                        ? (status.lastUsedAt ? "الربط يعمل ✓ · آخر استقبال " + formatDateTimeCompact(status.lastUsedAt) : "تم إنشاء رمز الربط · بانتظار أول عملية للتأكد من الاتصال")
                        : "الربط غير مفعّل. استخرج رمز ربط أولًا.";'''
          if old_connection in index:
              index = index.replace(old_connection, new_connection, 1)

          write(index_path, index)

          sw_path = "public/sw.js"
          sw = read(sw_path).replace(OLD_RELEASE, NEW_RELEASE)
          write(sw_path, sw)

          worker_path = "src/worker.js"
          worker = read(worker_path)

          worker = worker.replace(
              'const RELEASE_ID = "3.9.3-targeted-preview-statement-r4";',
              'const RELEASE_ID = "3.9.3-shortcuts-merchant-preview-r5";',
              1
          )

          accidental_anchor = '''  "3.9.3-commitment-bank-match-r3"
          ]);'''
          accidental_new = '''  "3.9.3-commitment-bank-match-r3",
            "3.9.3-targeted-preview-statement-r4"
          ]);'''
          if accidental_anchor in worker:
              worker = worker.replace(accidental_anchor, accidental_new, 1)

          amount_pattern = re.compile(
              r'''function automationAmountFromText\(value\) \{\n'''
              r'''  const text = normalizeAutomationText\(value\);\n'''
              r'''  const currency = String\.raw`[^`]+`;\n'''
              r'''  const before = new RegExp\([^;]+;\n'''
              r'''  const after = new RegExp\([^;]+;\n'''
              r'''  const raw = before\?\.\[1\] \|\| after\?\.\[1\] \|\| "";\n'''
              r'''  const amount = Number\(raw\.replace\(/,/g, ""\)\);\n'''
              r'''  return Number\.isFinite\(amount\) && amount > 0 \? Math\.round\(amount \* 100\) / 100 : 0;\n'''
              r'''\}'''
          )
          amount_replacement = r'''function automationAmountFromText(value) {
            const text = normalizeAutomationText(value);
            const currency = String.raw`(?:AED|DHS?|د\s*[.٫]?\s*[إا]|درهم(?:اً|ا|ين)?|دراهم)`;
            const labeled = new RegExp(String.raw`(?:^|\s)(?:amount|المبلغ)\s*[:=\-]\s*(?:` + currency + String.raw`\s*)?([0-9]{1,9}(?:[,][0-9]{3})*(?:\.[0-9]{1,2})?)(?:\s*` + currency + String.raw`)?(?=\s|$)`, "i").exec(text);
            const before = new RegExp(currency + String.raw`\s*[:\-]?\s*([0-9]{1,9}(?:[,][0-9]{3})*(?:\.[0-9]{1,2})?)`, "i").exec(text);
            const after = new RegExp(String.raw`([0-9]{1,9}(?:[,][0-9]{3})*(?:\.[0-9]{1,2})?)\s*` + currency, "i").exec(text);
            const raw = labeled?.[1] || before?.[1] || after?.[1] || "";
            const amount = Number(raw.replace(/,/g, ""));
            return Number.isFinite(amount) && amount > 0 ? Math.round(amount * 100) / 100 : 0;
          }'''
          if amount_pattern.search(worker):
              worker = amount_pattern.sub(lambda m: amount_replacement, worker, count=1)
          elif "(?:amount|المبلغ)" not in worker:
              raise SystemExit("Patch failed: automationAmountFromText not found")

          merchant_pattern = re.compile(
              r'''function automationMerchantFromText\(value\) \{\n'''
              r'''  const text = normalizeAutomationText\(value\);\n'''
              r'''  const english = /.*?;\n'''
              r'''  if \(english\?\.\[1\]\) return english\[1\]\.trim\(\);\n'''
              r'''  const arabic = /.*?;\n'''
              r'''  if \(arabic\?\.\[1\]\) return arabic\[1\]\.trim\(\);\n'''
              r'''  return "";\n'''
              r'''\}'''
          )
          merchant_replacement = r'''function cleanAutomationMerchant(value) {
            let text = normalizeAutomationText(value);
            if (!text) return "";
            text = text
              .replace(/^(?:your\s+)?(?:a\/c|account|acct|card)\s*(?:no\.?\s*)?[*xX•\-\s]*\d{2,12}\s+(?:at|to)\s+/i, "")
              .replace(/^(?:merchant|store|at|to|from)\s*[:=\-]?\s*/i, "")
              .replace(/\s+(?:(?:AB\s*U?\s*DHABI|ABU\s+DHABI|AL\s+AIN|DUBAI|SHARJAH|AJMAN|RAS\s+AL\s+KHAIMAH|FUJAIRAH|UMM\s+AL\s+QUWAIN)\s+)?(?:AE|UAE)$/i, "")
              .replace(/\s{2,}/g, " ")
              .trim();
            return text.slice(0, 100);
          }
          function automationMerchantFromText(value) {
            const text = normalizeAutomationText(value);
            const labeled = /(?:^|\s)(?:merchant|store|المتجر|التاجر)\s*[:=\-]\s*(.+?)(?=\s+(?:amount|المبلغ|reference|ref|card|date|source)\s*[:=\-]|$)/i.exec(text);
            if (labeled?.[1]) return cleanAutomationMerchant(labeled[1]);
            const english = /\b(?:at|to|from)\s+([^\n,;]{2,100}?)(?=\s+(?:on|using|with|ref|reference|card|ending|dated)\b|[.;,]|$)/i.exec(text);
            if (english?.[1]) return cleanAutomationMerchant(english[1]);
            const arabic = /(?:لدى|عند)\s+([^،.;]{2,100}?)(?=\s+(?:بتاريخ|بواسطة|مرجع)|[،.;]|$)/.exec(text);
            if (arabic?.[1]) return cleanAutomationMerchant(arabic[1]);
            return "";
          }'''
          if merchant_pattern.search(worker):
              worker = merchant_pattern.sub(lambda m: merchant_replacement, worker, count=1)
          elif "function cleanAutomationMerchant" not in worker:
              raise SystemExit("Patch failed: automationMerchantFromText not found")

          old_merchant_line = '  const merchant = normalizeAutomationText(payload.merchant || payload.store || automationMerchantFromText(rawText)).slice(0, 100);'
          new_merchant_line = '  const merchant = cleanAutomationMerchant(payload.merchant || payload.store || automationMerchantFromText(rawText));'
          if old_merchant_line in worker:
              worker = worker.replace(old_merchant_line, new_merchant_line, 1)

          old_preview_block = '''    const ownerCanPreview = isOwner && !Boolean(release.currentReleaseRejected);
              const displayTargetVersion = ownerCanPreview ? String(release.stagedVersion || VERSION) : publicPublishedVersion;
              const targetReleaseId = ownerCanPreview ? String(release.stagedReleaseId || RELEASE_ID) : publicPublishedReleaseId;
              // البنايات القديمة من 3.8.7 كانت تقارن رقم الإصدار فقط. محرف غير مرئي يجعلها ترى تحديثًا جديدًا مع بقاء الرقم ظاهرًا 3.8.7.
              const targetVersion = targetReleaseId === RELEASE_ID ? UPDATE_SIGNAL_VERSION : displayTargetVersion;'''
          new_preview_block = '''    const ownerCanPreview = isOwner && !Boolean(release.currentReleaseRejected);
              const stagedVersion = String(release.stagedVersion || VERSION);
              const stagedReleaseId = String(release.stagedReleaseId || RELEASE_ID);
              const targetedPreview = Boolean(
                auth?.user &&
                !isOwner &&
                String(auth.user.targetedPreviewReleaseId || "") === stagedReleaseId &&
                (!String(auth.user.targetedPreviewVersion || "") || String(auth.user.targetedPreviewVersion || "") === stagedVersion) &&
                !Boolean(release.currentReleaseRejected)
              );
              const previewEligible = ownerCanPreview || targetedPreview;
              const displayTargetVersion = previewEligible ? stagedVersion : publicPublishedVersion;
              const targetReleaseId = previewEligible ? stagedReleaseId : publicPublishedReleaseId;
              // Older clients may compare only the visible version. The invisible marker
              // makes a privately-authorized 3.9.2 user reliably notice the staged 3.9.3 build.
              const targetVersion = targetReleaseId === RELEASE_ID ? UPDATE_SIGNAL_VERSION : displayTargetVersion;'''
          if old_preview_block in worker:
              worker = worker.replace(old_preview_block, new_preview_block, 1)
          elif "const targetedPreview = Boolean(" not in worker:
              raise SystemExit("Patch failed: update/status preview block not found")

          old_role = '''      role: isOwner ? "owner" : "user",
                targetVersion,'''
          new_role = '''      role: isOwner ? "owner" : targetedPreview ? "targeted_preview" : "user",
                targetedPreview,
                targetVersion,'''
          if old_role in worker:
              worker = worker.replace(old_role, new_role, 1)

          write(worker_path, worker)

          checks = {
              "public/index.html": [NEW_RELEASE, "القالب الرسمي غير متوفر حاليًا", "الربط يعمل ✓"],
              "public/config.js": ["4fb8157133ba4255b689afa883cb3a3c", "503d528339174d3dbf69cc09eb61169a"],
              "public/sw.js": [NEW_RELEASE],
              "src/worker.js": [NEW_RELEASE, "cleanAutomationMerchant", 'role: isOwner ? "owner" : targetedPreview ? "targeted_preview" : "user"', "(?:amount|المبلغ)"],
          }
          for path, needles in checks.items():
              text = read(path)
              missing = [n for n in needles if n not in text]
              if missing:
                  raise SystemExit(f"Validation failed in {path}: missing {missing}")

          print("Salary Manager 3.9.3 r5 patch applied successfully.")
          PY

      - name: Validate Worker JavaScript
        run: node --check src/worker.js

      - name: Commit patched source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/config.js public/index.html public/sw.js src/worker.js
            git commit -m "Salary Manager 3.9.3 r5: shortcut templates, merchant cleanup, targeted preview fix"
            git push
          fi

      - name: Deploy patched build to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
          secrets: |
            AUTH_PEPPER
            OWNER_BOOTSTRAP_TOKEN
        env:
          AUTH_PEPPER: ${{ secrets.AUTH_PEPPER }}
          OWNER_BOOTSTRAP_TOKEN: ${{ secrets.OWNER_BOOTSTRAP_TOKEN }}

      - name: Summary
        run: |
          echo "### Salary Manager 3.9.3 r5" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Official bank-message Shortcut template linked" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Official Apple Wallet Shortcut template linked" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Empty-Shortcut fallback removed" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Merchant name cleanup added" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Wallet amount/merchant labeled-text parsing added" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Targeted 3.9.3 preview update fixed for selected users" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ New build deployed to Cloudflare for owner review" >> "$GITHUB_STEP_SUMMARY"
