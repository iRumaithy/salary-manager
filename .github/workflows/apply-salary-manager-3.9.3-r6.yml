name: Apply Salary Manager 3.9.3 r6

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-salary-manager-3.9.3-r6.yml"

permissions:
  contents: write

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply Salary Manager 3.9.3 r6
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          OLD_RELEASE = "3.9.3-shortcuts-merchant-preview-r5"
          NEW_RELEASE = "3.9.3-expense-insights-voice-wallet-r6"

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(text, old, new, label, already=None):
              if old in text:
                  return text.replace(old, new, 1)
              if already and already in text:
                  print(label + ": already applied")
                  return text
              raise SystemExit("Patch failed: " + label)

          def insert_before(text, anchor, block, label, marker=None):
              if marker and marker in text:
                  print(label + ": already applied")
                  return text
              if anchor not in text:
                  raise SystemExit("Patch failed: " + label)
              return text.replace(anchor, block + anchor, 1)

          # ------------------------------------------------------------------
          # public/index.html
          # ------------------------------------------------------------------
          index_path = "public/index.html"
          index = read(index_path)
          index = index.replace(OLD_RELEASE, NEW_RELEASE)

          # A) Apple Wallet + bank setup explanation
          old_guide = '''          hint.innerHTML = type === "wallet"
                      ? '<b>Apple Wallet:</b> ثبّت القالب وألصق رمز الربط المنسوخ عند السؤال. بعدها: Shortcuts ← Automation ← Transaction ← اختر بطاقتك ← Run Immediately. داخل الأتمتة أنشئ Text يحتوي <b>amount:</b> ثم Amount و<b>merchant:</b> ثم Merchant، وبعده Run Shortcut واختر قالب مدير الراتب ومرّر له الـText.'
                      : '<b>رسائل البنك:</b> ثبّت القالب وألصق رمز الربط المنسوخ عند السؤال. بعدها: Shortcuts ← Automation ← Message ← اختر Sender الخاص بالبنك ← Run Immediately ← Run Shortcut واختر قالب مدير الراتب، ومرّر نص الرسالة كـInput.';'''
          new_guide = '''          hint.innerHTML = type === "wallet"
                      ? '<div class="automation-mini-guide"><b>إعداد Apple Wallet</b><ol><li>ثبّت الاختصار والصق رمز الربط المنسوخ عند الطلب.</li><li>افتح الاختصار <b>«ربط مدير الراتب بـ Apple Wallet»</b> وانزل إلى <b>Get Contents of URL → Request Body → JSON</b>.</li><li>اضغط <b>Add new field</b> واكتب <b>amount</b>. اضغط قيمة الحقل ثم <b>Select Variable → Shortcut Input</b>، وبعد ظهور المتغير الأزرق اضغط عليه واختر <b>Amount</b>.</li><li>اضغط <b>Add new field</b> مرة أخرى واكتب <b>merchant</b>، ثم <b>Select Variable → Shortcut Input</b> واضغط المتغير الأزرق واختر <b>Merchant</b>.</li><li>في Apple Wallet لا تضف حقل <b>text</b>؛ هذا الحقل خاص برسائل البنك فقط.</li><li>افتح <b>Shortcuts → Automation → + → Wallet</b>، اختر بطاقتك ثم <b>Run Immediately</b>.</li><li>اختر <b>«ربط مدير الراتب بـ Apple Wallet»</b> وتأكد من ظهور علامة ✓ عليه، ثم اضغط رجوع و<b>Done</b>.</li></ol><small>بعد وصول أول عملية ناجحة ستظهر حالة «الربط يعمل ✓» داخل مدير الراتب.</small></div>'
                      : '<div class="automation-mini-guide"><b>إعداد رسائل البنك</b><ol><li>ثبّت الاختصار والصق رمز الربط المنسوخ عند الطلب.</li><li>داخل القالب يكون <b>source = bank_message</b> و<b>text = Shortcut Input</b>.</li><li>افتح <b>Shortcuts → Automation → Message</b> واختر اسم البنك في <b>Sender</b>.</li><li>اختر <b>Run Immediately</b> ثم اختر اختصار «ربط مدير الراتب برسائل البنك» ومرّر نص الرسالة كـInput.</li><li>اضغط <b>Done</b>.</li></ol></div>';'''
          index = replace_once(index, old_guide, new_guide, "Wallet/bank guide", "إعداد Apple Wallet")

          # B) More realistic expense categories in the quick grid
          new_buttons = '''                <button class="expense-category-choice" type="button" data-expense-category="مغسلة ملابس" style="--cat-accent:#3f7f8f;--cat-soft:#e9f5f7" aria-pressed="false">
                            <span class="expense-category-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"></rect><circle cx="12" cy="13" r="5"></circle><path d="M8 6h.01M11 6h5"></path></svg></span><span>مغسلة ملابس</span>
                          </button>
                          <button class="expense-category-choice" type="button" data-expense-category="عناية شخصية" style="--cat-accent:#a65f83;--cat-soft:#f8edf3" aria-pressed="false">
                            <span class="expense-category-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 4h8M10 4v4l-4 4v7h12v-7l-4-4V4M9 14h6"></path></svg></span><span>عناية شخصية</span>
                          </button>
                          <button class="expense-category-choice" type="button" data-expense-category="صيانة سيارة" style="--cat-accent:#9a6a2f;--cat-soft:#f8f0df" aria-pressed="false">
                            <span class="expense-category-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 17h14l-1-6-2-4H8l-2 4-1 6ZM7 17v2M17 17v2"></path><path d="m14.5 5 2-2 2.5 2.5-2 2"></path></svg></span><span>صيانة سيارة</span>
                          </button>
                          <button class="expense-category-choice" type="button" data-expense-category="خدمات منزلية" style="--cat-accent:#5a7b6f;--cat-soft:#ebf2ef" aria-pressed="false">
                            <span class="expense-category-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8M5 10v10h14V10"></path><path d="m9 16 2 2 4-5"></path></svg></span><span>خدمات منزلية</span>
                          </button>
                          <button class="expense-category-choice" type="button" data-expense-category="توصيل" style="--cat-accent:#4e7aa5;--cat-soft:#eaf1f8" aria-pressed="false">
                            <span class="expense-category-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 7h11v10H3V7Zm11 4h4l3 3v3h-7v-6Z"></path><circle cx="7" cy="18" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg></span><span>توصيل</span>
