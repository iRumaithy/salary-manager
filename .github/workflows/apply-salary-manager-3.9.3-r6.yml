              /* 3.9.3 r6 — category infographic and simplified Shortcut guide */
              .automation-mini-guide { line-height:1.85; color:var(--ink); }
              .automation-mini-guide > b { display:block; margin-bottom:7px; color:var(--forest); font-size:12px; }
              .automation-mini-guide ol { margin:7px 0 0; padding-inline-start:22px; }
