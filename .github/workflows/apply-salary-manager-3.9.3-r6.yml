                  };'''
          new_onresult = '''        recognition.onresult = function (event) {
                    var parts = [];
                    for (var i = 0; i < event.results.length; i += 1) {
                      var best = bestExpenseVoiceAlternative(event.results[i]);
                      if (best) parts.push(best);
                    }
                    var combined = parts.join(" ").replace(/\\s+/g, " ").trim();
                    if (combined) latestTranscript = combined;
                    if (latestTranscript) setExpenseVoiceStatus(voiceLocaleText("سمعت: «" + latestTranscript + "»", "Heard: “" + latestTranscript + "”"), "listening");
                  };'''
