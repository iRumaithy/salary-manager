          # G) improve speech recognition accuracy by scoring multiple alternatives
          voice_helpers = r'''
                function expenseVoiceTranscriptScore(text, confidence) {
                  text = String(text || "").trim();
                  if (!text) return -1;
                  var score = Math.max(0, Number(confidence) || 0) * 20;
                  if (parseSpokenExpenseAmount(text) > 0) score += 100;
                  if (detectExpenseCategoryFromVoice(text) !== "أخرى") score += 35;
                  if (/(?:درهم|دراهم|aed|dhs?)/i.test(text)) score += 15;
                  score += Math.min(18, text.length / 4);
                  return score;
                }

                function bestExpenseVoiceAlternative(result) {
                  if (!result || !result.length) return "";
                  var best = "";
                  var bestScore = -1;
                  for (var i = 0; i < result.length; i += 1) {
                    var candidate = String(result[i] && result[i].transcript || "").trim();
                    var score = expenseVoiceTranscriptScore(candidate, result[i] && result[i].confidence);
                    if (score > bestScore) {
                      bestScore = score;
                      best = candidate;
                    }
                  }
                  return best;
                }

