              if missing:
                  raise SystemExit("Validation failed in " + path + ": " + repr(missing))

          if index.count('id="expenseCategoryInfographic"') != 1:
              raise SystemExit("Validation failed: duplicate/missing expenseCategoryInfographic")
          if index.count("function expenseCategoryBreakdownForItems") != 1:
              raise SystemExit("Validation failed: duplicate infographic helper")
          if index.count("function bestExpenseVoiceAlternative") != 1:
              raise SystemExit("Validation failed: duplicate voice helper")

          print("Salary Manager 3.9.3 r6 patch applied successfully.")
          PY

      - name: Validate Worker JavaScript
        run: node --check src/worker.js

      - name: Validate inline JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path("public/index.html").read_text(encoding="utf-8")
          blocks = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", text, flags=re.S|re.I)
          inline = "\n".join(block for block in blocks if block.strip())
          Path("/tmp/salary-inline-r6.js").write_text(inline, encoding="utf-8")
          PY
          node --check /tmp/salary-inline-r6.js

      - name: Commit patched source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/index.html public/sw.js src/worker.js
            git commit -m "Salary Manager 3.9.3 r6: categories, voice accuracy, expense infographic"
            git push
          fi

      - name: Deploy patched build to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
          secrets: |
            AUTH_PEPPER
            OWNER_BOOTSTRAP_TOKEN
        env:
          AUTH_PEPPER: ${{ secrets.AUTH_PEPPER }}
          OWNER_BOOTSTRAP_TOKEN: ${{ secrets.OWNER_BOOTSTRAP_TOKEN }}

      - name: Summary
        run: |
          echo "### Salary Manager 3.9.3 r6" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Simplified Apple Wallet Amount / Merchant / Shortcut Input guide" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Added realistic expense categories including Laundry" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Improved voice expense recognition with multiple alternatives" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Added live expense-by-category infographic under Salary Allocation" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Added category infographic to saved monthly statements and PDF" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Expanded bank/Wallet auto-categorization" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Deployed staged r6 build to Cloudflare for owner review" >> "$GITHUB_STEP_SUMMARY"
