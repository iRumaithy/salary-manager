                          </button>
                          <button class="expense-category-choice" type="button" data-expense-category="مناسبات" style="--cat-accent:#a56e9e;--cat-soft:#f6edf6" aria-pressed="false">
                            <span class="expense-category-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3v4M5 7l3 2M19 7l-3 2M7 13h10l2 8H5l2-8Z"></path><path d="M9 13a3 3 0 0 1 6 0"></path></svg></span><span>مناسبات</span>
                          </button>
          '''
          other_button = '''                <button class="expense-category-choice" type="button" data-expense-category="أخرى" style="--cat-accent:#657477;--cat-soft:#eef1f1" aria-pressed="false">'''
          index = insert_before(index, other_button, new_buttons, "new expense buttons", 'data-expense-category="مغسلة ملابس"')

          # hidden category select
          select_anchor = '''                <option value="أخرى">أخرى</option>'''
          select_options = '''                <option value="مغسلة ملابس">مغسلة ملابس</option>
                          <option value="عناية شخصية">عناية شخصية</option>
                          <option value="صيانة سيارة">صيانة سيارة</option>
                          <option value="خدمات منزلية">خدمات منزلية</option>
                          <option value="توصيل">توصيل</option>
                          <option value="أطفال وعائلة">أطفال وعائلة</option>
                          <option value="حيوانات أليفة">حيوانات أليفة</option>
                          <option value="مناسبات">مناسبات</option>
          '''
          index = insert_before(index, select_anchor, select_options, "new expense select options", '<option value="مغسلة ملابس">')

