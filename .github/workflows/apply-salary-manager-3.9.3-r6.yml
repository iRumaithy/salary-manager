                    if (!map[category]) map[category] = { category:category, amount:0, count:0 };
                    map[category].amount = roundMoney(map[category].amount + amount);
                    map[category].count += 1;
                    total = roundMoney(total + amount);
                    count += 1;
                  });
                  var groups = Object.keys(map).map(function (key) {
