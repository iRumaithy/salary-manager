                    { value:"عناية شخصية", words:["صالون","حلاق","حلاقه","سبا","barber","salon","spa","beauty","مناكير","بديكير"] },
                    { value:"خدمات منزلية", words:["تنظيف منزل","عامله","عامل تنظيف","سباك","كهربائي","مكافحه حشرات","مكافحة حشرات","cleaning service","plumber","electrician","pest control"] },
