          '''
          index = insert_before(index, "  </style>", css, "r6 CSS", "3.9.3 r6 — category infographic")

          # F) voice category detection additions (specific before generic)
          old_voice_start = '''        var rules = [
                    { value:"قهوة", words:["قهوه","قهوة","كوفي","كوفيه","كوفي شوب","كوفيشوب","كافي","كافيه","كافيهات","coffee","كابتشينو","لاتيه","اسبريسو","شاي"] },'''
