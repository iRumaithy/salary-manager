                            <span class="expense-category-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"></circle><circle cx="16.5" cy="9" r="2.5"></circle><path d="M4 20c.5-4 2-6 5-6s4.5 2 5 6M13 20c.3-3 1.5-4.5 3.5-4.5S20 17 20 20"></path></svg></span><span>أطفال وعائلة</span>
                          </button>
                          <button class="expense-category-choice" type="button" data-expense-category="حيوانات أليفة" style="--cat-accent:#7a7450;--cat-soft:#f2f0e6" aria-pressed="false">
