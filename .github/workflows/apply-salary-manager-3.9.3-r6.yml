          new_symbols = '''        "تعليم": "ع",
                  "هدايا": "هـ",
                  "مغسلة ملابس": "غ",
                  "عناية شخصية": "ن",
                  "صيانة سيارة": "ص",
                  "خدمات منزلية": "خ",
                  "توصيل": "و",
                  "أطفال وعائلة": "ع",
                  "حيوانات أليفة": "ح",
                  "مناسبات": "م",
                  "أخرى": "أ"
                };

                var expenseCategoryMeta = {
                  "طعام": { label:"مطاعم", color:"#c66445", soft:"#fff0e8", icon:"🍽️" },
                  "مشتريات": { label:"بقالة", color:"#3a7c67", soft:"#e9f5ef", icon:"🛒" },
                  "مواصلات": { label:"وقود وتنقل", color:"#b87928", soft:"#fbf1dc", icon:"⛽" },
                  "فواتير": { label:"فواتير", color:"#2d7088", soft:"#e8f3f7", icon:"🧾" },
                  "اتصالات": { label:"اتصالات", color:"#526cb3", soft:"#eef0fb", icon:"📱" },
                  "صحة": { label:"صحة", color:"#b84f62", soft:"#fbecef", icon:"🩺" },
                  "ترفيه": { label:"ترفيه", color:"#705a9b", soft:"#f0ecf8", icon:"🎮" },
                  "قهوة": { label:"قهوة", color:"#8a6448", soft:"#f5eee8", icon:"☕" },
                  "ملابس": { label:"تسوق وملابس", color:"#8c5b7d", soft:"#f7edf4", icon:"👕" },
                  "منزل": { label:"منزل وإيجار", color:"#50736c", soft:"#eaf1ef", icon:"🏠" },
                  "سفر": { label:"سفر", color:"#3d83a2", soft:"#eaf5f9", icon:"✈️" },
                  "تعليم": { label:"تعليم", color:"#5d5aa2", soft:"#efeffa", icon:"🎓" },
                  "هدايا": { label:"هدايا", color:"#bc6b63", soft:"#fbeeea", icon:"🎁" },
                  "مغسلة ملابس": { label:"مغسلة ملابس", color:"#3f7f8f", soft:"#e9f5f7", icon:"🧺" },
                  "عناية شخصية": { label:"عناية شخصية", color:"#a65f83", soft:"#f8edf3", icon:"✂️" },
                  "صيانة سيارة": { label:"صيانة سيارة", color:"#9a6a2f", soft:"#f8f0df", icon:"🔧" },
                  "خدمات منزلية": { label:"خدمات منزلية", color:"#5a7b6f", soft:"#ebf2ef", icon:"🧹" },
                  "توصيل": { label:"توصيل", color:"#4e7aa5", soft:"#eaf1f8", icon:"🚚" },
                  "أطفال وعائلة": { label:"أطفال وعائلة", color:"#b06f48", soft:"#faefe7", icon:"👨‍👩‍👧" },
                  "حيوانات أليفة": { label:"حيوانات أليفة", color:"#7a7450", soft:"#f2f0e6", icon:"🐾" },
                  "مناسبات": { label:"مناسبات", color:"#a56e9e", soft:"#f6edf6", icon:"🎉" },
                  "أخرى": { label:"أخرى", color:"#657477", soft:"#eef1f1", icon:"•••" }
                };'''
          index = replace_once(index, old_symbols, new_symbols, "expense symbol metadata", "var expenseCategoryMeta = {")

          # D) home infographic directly under salary distribution
          old_overview = '''                <div class="insight" id="monthlyInsight">أدخل راتبك أولًا لتحصل على قراءة واضحة لميزانية الشهر.</div>
                        </div>
                      </div>
                    </article>

                    <article class="panel panel-pad">
                      <div class="panel-head">
                        <div>
                          <h2 class="panel-title">استحقاقات هذا الشهر</h2>'''
          new_overview = '''                <div class="insight" id="monthlyInsight">أدخل راتبك أولًا لتحصل على قراءة واضحة لميزانية الشهر.</div>
                        </div>
                      </div>
                    </article>

                    <article class="panel panel-pad expense-category-overview-panel">
                      <div class="panel-head">
