name: Apply Salary Manager 3.9.3 r8 Safe Stage

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-salary-manager-3.9.3-r8.yml"

permissions:
  contents: write

jobs:
  stage-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable r7
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify stable starting point
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'var APP_VERSION = "3.9.3";' public/index.html
          grep -q '3.9.3-autoapprove-sync-race-r7' public/index.html
          grep -q 'const VERSION = "3.9.3";' src/worker.js
          grep -q 'const RELEASE_ID = "3.9.3-autoapprove-sync-race-r7";' src/worker.js
          grep -q 'salary-manager-v3.9.3-autoapprove-sync-race-r7' public/sw.js

      - name: Archive exact r7 before staging r8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/releases/3.9.3-autoapprove-sync-race-r7
          cp public/index.html public/releases/3.9.3-autoapprove-sync-race-r7/app.html
          cp public/index.html public/releases/3.9.3-autoapprove-sync-race-r7/index.html
          cp public/sw.js public/releases/3.9.3-autoapprove-sync-race-r7/sw.js
          grep -q '3.9.3-autoapprove-sync-race-r7' public/releases/3.9.3-autoapprove-sync-race-r7/app.html
          grep -q 'salary-manager-v3.9.3-autoapprove-sync-race-r7' public/releases/3.9.3-autoapprove-sync-race-r7/sw.js

      - name: Apply r8 release-safety patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = "3.9.3-autoapprove-sync-race-r7"
          new = "3.9.3-safe-staging-automation-r8"

          index_path = Path("public/index.html")
          index = index_path.read_text(encoding="utf-8")
          if old not in index:
              raise SystemExit("r7 release marker not found in public/index.html")
          index = index.replace(old, new)
          index_path.write_text(index, encoding="utf-8")

          sw_path = Path("public/sw.js")
          sw = sw_path.read_text(encoding="utf-8")
          old_cache = 'salary-manager-v3.9.3-autoapprove-sync-race-r7'
          new_cache = 'salary-manager-v3.9.3-safe-staging-automation-r8'
          if old_cache not in sw:
              raise SystemExit("r7 cache marker not found in public/sw.js")
          sw = sw.replace(old_cache, new_cache, 1)
          sw_path.write_text(sw, encoding="utf-8")

          worker_path = Path("src/worker.js")
          worker = worker_path.read_text(encoding="utf-8")
          replacements = [
              ('const RELEASE_ID = "3.9.3-autoapprove-sync-race-r7";', 'const RELEASE_ID = "3.9.3-safe-staging-automation-r8";'),
              ('const UPDATE_SIGNAL_VERSION = "3.9.3\\u200B";', 'const UPDATE_SIGNAL_VERSION = "3.9.3\\u200C";'),
              ('const PREVIOUS_PUBLISHED_VERSION = "3.8.6";', 'const PREVIOUS_PUBLISHED_VERSION = "3.9.3";'),
              ('const PREVIOUS_RELEASE_ID = "3.8.6";', 'const PREVIOUS_RELEASE_ID = "3.9.3-autoapprove-sync-race-r7";'),
          ]
          for before, after in replacements:
              if before not in worker:
                  raise SystemExit("Missing worker marker: " + before)
              worker = worker.replace(before, after, 1)

          accidental_block = worker.split('const ACCIDENTAL_PREPUBLISH_RELEASE_IDS = new Set([', 1)[1].split(']);', 1)[0]
          if '3.9.3-autoapprove-sync-race-r7' in accidental_block:
              raise SystemExit("r7 must not be in ACCIDENTAL_PREPUBLISH_RELEASE_IDS")

          worker_path.write_text(worker, encoding="utf-8")
          PY

      - name: Fix same-version deployment detection
        shell: bash
        run: |
          cat > .github/workflows/notify-owner-after-deploy.yml <<'YAML'
          name: Notify owner after deploy

          on:
            push:
              branches: [main]
              paths:
                - "public/**"
                - "src/**"
                - "package.json"
                - "wrangler.jsonc"

          permissions:
            contents: read

          jobs:
            wait-for-cloudflare:
              runs-on: ubuntu-latest
              timeout-minutes: 12
              steps:
                - uses: actions/checkout@v4
                - name: Read expected build
                  id: expected
                  shell: bash
                  run: |
                    VERSION=$(node -p "require('./package.json').version")
                    RELEASE_ID=$(python3 - <<'PY'
                    import re
                    from pathlib import Path
                    text = Path('src/worker.js').read_text(encoding='utf-8')
                    m = re.search(r'const RELEASE_ID = "([^"]+)";', text)
                    if not m:
                        raise SystemExit('RELEASE_ID not found')
                    print(m.group(1))
                    PY
                    )
                    echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                    echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
                - name: Wait for exact deployed build
                  env:
                    EXPECTED_VERSION: ${{ steps.expected.outputs.version }}
                    EXPECTED_RELEASE_ID: ${{ steps.expected.outputs.release_id }}
                  run: |
                    set -e
                    URL="https://salary-manager.alromaithi-3bo0d.workers.dev/api/health"
                    for i in $(seq 1 120); do
                      BODY=$(curl -fsS --max-time 8 "${URL}?deploy_check=$(date +%s)" || true)
                      echo "$BODY"
                      if echo "$BODY" | grep -q "\"version\":\"${EXPECTED_VERSION}\"" && echo "$BODY" | grep -q "\"stagedReleaseId\":\"${EXPECTED_RELEASE_ID}\""; then
                        echo "Exact build ${EXPECTED_RELEASE_ID} is live."
                        exit 0
                      fi
                      sleep 5
                    done
                    echo "Timed out waiting for exact Cloudflare release ${EXPECTED_RELEASE_ID}" >&2
                    exit 1
          YAML

      - name: Validate agreed automation features remain intact
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'function cleanAutomationMerchant' src/worker.js
          grep -q 'targetedPreview' src/worker.js
          grep -q 'mergedAutomationChanges' src/worker.js
          grep -q 'إعداد Apple Wallet' public/index.html
          grep -q 'text = Shortcut Input' public/index.html
          grep -q 'الربط يعمل ✓' public/index.html
          grep -q 'بانتظار أول عملية للتأكد من الاتصال' public/index.html

          node <<'NODE'
          function normalizeAutomationText(value) {
            return String(value || "").replace(/\s+/g, " ").trim();
          }
          function cleanAutomationMerchant(value) {
            let text = normalizeAutomationText(value);
            if (!text) return "";
            text = text
              .replace(/^(?:your\s+)?(?:a\/c|account|acct|card)\s*(?:no\.?\s*)?[*xX•\-\s]*\d{2,12}\s+(?:at|to)\s+/i, "")
              .replace(/^(?:merchant|store|at|to|from)\s*[:=\-]?\s*/i, "")
              .replace(/\s+(?:(?:AB\s*U?\s*DHABI|ABU\s+DHABI|AL\s+AIN|DUBAI|SHARJAH|AJMAN|RAS\s+AL\s+KHAIMAH|FUJAIRAH|UMM\s+AL\s+QUWAIN)\s+)?(?:AE|UAE)$/i, "")
              .replace(/\s{2,}/g, " ").trim();
            return text.slice(0, 100);
          }
          function automationMerchantFromText(value) {
            const text = normalizeAutomationText(value);
            const english = /\b(?:at|to|from)\s+([^\n,;]{2,100}?)(?=\s+(?:on|using|with|ref|reference|card|ending|dated)\b|[.;,]|$)/i.exec(text);
            if (english && english[1]) return cleanAutomationMerchant(english[1]);
            return "";
          }
          const sample = 'Transaction of AED 68.00 debited from your a/c *200 at ALWAQAED LAUNDRY AB U DHABI AE. Avl Bal is AED 17640.53';
          const merchant = automationMerchantFromText(sample);
          if (merchant !== 'ALWAQAED LAUNDRY') {
            console.error('Merchant test failed:', merchant);
            process.exit(1);
          }
          console.log('Merchant parser test OK:', merchant);
          NODE

      - name: Validate JavaScript and rollback archive
        shell: bash
        run: |
          set -euo pipefail
          node --check src/worker.js
          node --check public/sw.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('public/index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
          inline = '\n'.join(block for block in blocks if block.strip())
          Path('/tmp/salary-inline-r8.js').write_text(inline, encoding='utf-8')
          PY
          node --check /tmp/salary-inline-r8.js
          test -f public/releases/3.9.3-autoapprove-sync-race-r7/app.html
          test -f public/releases/3.9.3-autoapprove-sync-race-r7/index.html
          test -f public/releases/3.9.3-autoapprove-sync-race-r7/sw.js
          grep -q '3.9.3-autoapprove-sync-race-r7' public/releases/3.9.3-autoapprove-sync-race-r7/app.html
          grep -q '3.9.3-safe-staging-automation-r8' public/index.html
          grep -q 'const PREVIOUS_RELEASE_ID = "3.9.3-autoapprove-sync-race-r7";' src/worker.js

      - name: Commit r7 archive and staged r8
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/sw.js src/worker.js public/releases/3.9.3-autoapprove-sync-race-r7 .github/workflows/notify-owner-after-deploy.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Stage safe Salary Manager 3.9.3 r8 with r7 rollback archive"
            git push
          fi

      - name: Deploy staged r8 to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
          secrets: |
            AUTH_PEPPER
            OWNER_BOOTSTRAP_TOKEN
        env:
          AUTH_PEPPER: ${{ secrets.AUTH_PEPPER }}
          OWNER_BOOTSTRAP_TOKEN: ${{ secrets.OWNER_BOOTSTRAP_TOKEN }}

      - name: Verify exact r8 is live
        shell: bash
        run: |
          set -euo pipefail
          URL="https://salary-manager.alromaithi-3bo0d.workers.dev/api/health"
          EXPECTED="3.9.3-safe-staging-automation-r8"
          LIVE=""
          for i in $(seq 1 90); do
            LIVE=$(curl -fsS --max-time 8 "${URL}?r8_check=$(date +%s)" || true)
            echo "$LIVE"
            if echo "$LIVE" | grep -q "\"stagedReleaseId\":\"${EXPECTED}\""; then
              break
            fi
            sleep 4
          done
          echo "$LIVE" | grep -q "\"stagedReleaseId\":\"${EXPECTED}\""

      - name: Verify public users remain on archived r7
        shell: bash
        run: |
          set -euo pipefail
          URL="https://salary-manager.alromaithi-3bo0d.workers.dev/"
          BODY=$(curl -fsSL --max-time 12 "${URL}?public_r7_check=$(date +%s)")
          echo "$BODY" | grep -q '3.9.3-autoapprove-sync-race-r7'
          if echo "$BODY" | grep -q '3.9.3-safe-staging-automation-r8'; then
            echo "SECURITY FAILURE: unauthenticated public request received staged r8" >&2
            exit 1
          fi
          echo "Public fallback test OK: normal users remain on r7."

      - name: Summary
        run: |
          echo "### Salary Manager 3.9.3 r8 Safe Stage" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Exact r7 app/index/service-worker archived before staging" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Existing bank merchant cleanup, Wallet guide, targeted preview, and auto-approve sync fix retained" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Same-visible-version deployment detection now checks RELEASE_ID, not version only" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Merchant parser sample verified: ALWAQAED LAUNDRY" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Unauthenticated public request verified to remain on archived r7" >> "$GITHUB_STEP_SUMMARY"
          echo "🔒 r8 is staged for owner review only; users are not upgraded until explicit owner publication" >> "$GITHUB_STEP_SUMMARY"
