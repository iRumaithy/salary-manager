name: Apply Salary Manager 3.9.4 Card Layout r8

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-salary-manager-3.9.4-card-layout-r8.yml"

permissions:
  contents: write

jobs:
  patch-test-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current r6
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify current staged source is r6
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'var APP_VERSION = "3.9.4";' public/index.html
          grep -Fq 'var APP_RELEASE_ID = "3.9.4-card-deposit-icons-r6";' public/index.html
          grep -Fq 'const RELEASE_ID = "3.9.4-card-deposit-icons-r6";' src/worker.js
          grep -Fq 'salary-manager-v3.9.4-card-deposit-icons-r6' public/sw.js
          test -f public/releases/3.9.3-autoapprove-sync-race-r7/app.html
          test -f public/releases/3.9.3-autoapprove-sync-race-r7/sw.js

      - name: Prepare r8 patch 1/2
        shell: bash
        run: |
          printf '%s' '' > /tmp/salary-r8-patch.b64

      - name: Prepare r8 patch 2/2
        shell: bash
        run: |
          printf '%s' 'dGNoIGFwcGxpZWQgc3VjY2Vzc2Z1bGx5LiIpCg==' >> /tmp/salary-r8-patch.b64

      - name: Decode and apply r8 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d /tmp/salary-r8-patch.b64 > /tmp/salary-r8-patch.py
          python3 -m py_compile /tmp/salary-r8-patch.py
          python3 /tmp/salary-r8-patch.py

      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check src/worker.js
          node --check public/sw.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path("public/index.html").read_text(encoding="utf-8")
          blocks=re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>",text,flags=re.S|re.I)
          Path("/tmp/salary-r8-inline.js").write_text("\n".join(x for x in blocks if x.strip()),encoding="utf-8")
          PY
          node --check /tmp/salary-r8-inline.js

      - name: Validate requested r8 changes
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'var APP_RELEASE_ID = "3.9.4-card-layout-r8";' public/index.html
          grep -Fq 'const RELEASE_ID = "3.9.4-card-layout-r8";' src/worker.js
          grep -Fq 'salary-manager-v3.9.4-card-layout-r8' public/sw.js
          grep -Fq '3.9.4 r8 — bank card placement refinement' public/index.html
          grep -Fq 'bottom:24px' public/index.html
          grep -Fq 'left:104px' public/index.html
          grep -Fq 'M6 3v7M4 3v4.5' public/index.html
          grep -Fq "hotel:'<svg" public/index.html
          grep -Fq "cinema:'<svg" public/index.html

      - name: Commit staged r8
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/sw.js src/worker.js
          git commit -m "Salary Manager 3.9.4 r8 refine bank card layout and restaurant icon"
          git push

      - name: Deploy staged r8 to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
          secrets: |
            AUTH_PEPPER
            OWNER_BOOTSTRAP_TOKEN
        env:
          AUTH_PEPPER: ${{ secrets.AUTH_PEPPER }}
          OWNER_BOOTSTRAP_TOKEN: ${{ secrets.OWNER_BOOTSTRAP_TOKEN }}

      - name: Verify exact r8 is live
        shell: bash
        run: |
          set -euo pipefail
          URL="https://salary-manager.alromaithi-3bo0d.workers.dev/api/health"
          BODY=""
          for i in $(seq 1 90); do
            BODY=$(curl -fsS --max-time 8 "${URL}?r8_check=$(date +%s)" || true)
            echo "$BODY"
            if echo "$BODY" | grep -Fq '"version":"3.9.4"' && echo "$BODY" | grep -Fq '"stagedReleaseId":"3.9.4-card-layout-r8"'; then
              break
            fi
            sleep 4
          done
          echo "$BODY" | grep -Fq '"stagedReleaseId":"3.9.4-card-layout-r8"'

      - name: Verify public users remain on stable r7
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(curl -fsSL --max-time 15 "https://salary-manager.alromaithi-3bo0d.workers.dev/?public_r8_check=$(date +%s)")
          echo "$BODY" | grep -Fq '3.9.3-autoapprove-sync-race-r7'
          if echo "$BODY" | grep -Fq '3.9.4-card-layout-r8'; then
            echo "SECURITY FAILURE: staged r8 leaked to public users" >&2
            exit 1
          fi

      - name: Summary
        shell: bash
        run: |
          echo "### Salary Manager 3.9.4 r8" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ 16-digit number moved to bottom center with embossed treatment" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Salary content raised slightly" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ VALID THRU placed above the number on the left" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Contactless mark placed directly beside the EMV chip" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Restaurant icon is fork + knife only" >> "$GITHUB_STEP_SUMMARY"
          echo "🔒 Owner-only stage retained; public users stay on stable 3.9.3 r7" >> "$GITHUB_STEP_SUMMARY"
