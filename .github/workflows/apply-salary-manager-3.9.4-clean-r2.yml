                .automation-visual-editor{grid-template-columns:32px 1fr}
                .automation-visual-editor>span:nth-child(2){display:none}
              }
          '''
          index = replace_once(index, '\n  </style>', '\n' + css + '\n  </style>', "head style closing tag")
          
          helpers = r'''
                /* 3.9.4 Clean Rebuild — integrated appearance and transaction visuals */
                var APP_THEME_KEY_394 = "monthlySalaryManager.theme.v394";
                var SALARY_CARD_STYLE_KEY_394 = "monthlySalaryManager.salaryCardStyle.v394";
                var MERCHANT_VISUAL_PREFS_KEY_394 = "monthlySalaryManager.merchantVisualPrefs.v394";
                var SALARY_CARD_STYLES_394 = ["classic","emerald","obsidian","midnight","ivory","burgundy"];
                var automationPendingVisualOverrides = Object.create(null);
          
                var expenseVisualIcons = {
                  shopping:'<svg viewBox="0 0 24 24"><path d="M5 8h14l-1.2 11H6.2L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
                  restaurant:'<svg viewBox="0 0 24 24"><path d="M6 3v8M4 3v5a2 2 0 0 0 4 0V3M12 3v18M17 3c2 2 2 5 0 7h-2V3Z"/></svg>',
                  coffee:'<svg viewBox="0 0 24 24"><path d="M5 8h10v5a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V8Z"/><path d="M15 9h2a2.5 2.5 0 0 1 0 5h-2M8 3v2M12 3v2"/></svg>',
