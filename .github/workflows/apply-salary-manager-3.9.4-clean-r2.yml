              html[data-app-theme="dark"] .expense-category-donut::after{background:var(--paper);border-color:var(--line)}
              html[data-app-theme="dark"] .salary-card-style-choice{color:var(--ink);background:var(--paper);border-color:var(--line)}
              html[data-app-theme="dark"] .salary-card-style-choice.is-active{border-color:var(--teal)}
              html[data-app-theme="dark"] .modal-head,html[data-app-theme="dark"] .modal-foot{border-color:var(--line)}
          
              @media(max-width:620px){
                .salary-card-style-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
                .salary-card.salary-card-bank{min-height:286px;padding:88px 22px 22px}
                .salary-card.salary-card-bank .hero-kicker{top:24px;right:22px;max-width:48%}
                .salary-card.salary-card-bank .bank-card-hardware{top:19px;left:20px;gap:8px}
