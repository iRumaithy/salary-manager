name: Apply Salary Manager 3.9.4 Clean Rebuild

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-salary-manager-3.9.4-clean-r2.yml"

permissions:
  contents: write

jobs:
  patch-test-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify exact stable r7 starting point
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'var APP_VERSION = "3.9.3";' public/index.html
          grep -q 'var APP_RELEASE_ID = "3.9.3-autoapprove-sync-race-r7";' public/index.html
          grep -q 'const VERSION = "3.9.3";' src/worker.js
          grep -q 'const RELEASE_ID = "3.9.3-autoapprove-sync-race-r7";' src/worker.js
          grep -q 'salary-manager-v3.9.3-autoapprove-sync-race-r7' public/sw.js

      - name: Archive exact stable r7 before changing anything
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/releases/3.9.3-autoapprove-sync-race-r7
          cp public/index.html public/releases/3.9.3-autoapprove-sync-race-r7/app.html
          cp public/index.html public/releases/3.9.3-autoapprove-sync-race-r7/index.html
          cp public/sw.js public/releases/3.9.3-autoapprove-sync-race-r7/sw.js

      - name: Prepare clean 3.9.4 patch 1/4
        shell: bash
        run: |
          cat > /tmp/salary-manager-394-clean.py <<'SALARY394_PART_1_X9'
          from pathlib import Path
          import re
          
          INDEX = Path("public/index.html")
          WORKER = Path("src/worker.js")
          SW = Path("public/sw.js")
          PACKAGE = Path("package.json")
          NOTIFY = Path(".github/workflows/notify-owner-after-deploy.yml")
          
          OLD_RELEASE = "3.9.3-autoapprove-sync-race-r7"
          NEW_RELEASE = "3.9.4-clean-rebuild-r1"
          
          def read(path):
              return path.read_text(encoding="utf-8")
          
          def write(path, text):
              path.write_text(text, encoding="utf-8")
          
          def require(text, needle, label):
              if needle not in text:
                  raise SystemExit("Patch failed — missing " + label)
          
          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit("Patch failed — missing " + label)
              return text.replace(old, new, 1)
          
          index = read(INDEX)
          
          require(index, 'var APP_VERSION = "3.9.3";', "APP_VERSION r7")
          require(index, 'var APP_RELEASE_ID = "3.9.3-autoapprove-sync-race-r7";', "APP_RELEASE_ID r7")
          index = index.replace(OLD_RELEASE, NEW_RELEASE)
          index = replace_once(index, 'var APP_VERSION = "3.9.3";', 'var APP_VERSION = "3.9.4";', "APP_VERSION")
          
          theme_boot = r'''  <script id="appThemePrepaint">
              (function () {
                try {
                  var mode = localStorage.getItem("monthlySalaryManager.theme.v394");
                  if (mode === "dark") document.documentElement.setAttribute("data-app-theme", "dark");
                } catch (_) {}
              })();
            </script>
          '''
          theme_anchor = '  <meta name="theme-color" content="#123f3b">\n'
          if 'id="appThemePrepaint"' not in index:
              index = replace_once(index, theme_anchor, theme_anchor + theme_boot, "theme prepaint anchor")
          
          theme_button = r'''          <button class="ghost-btn theme-toggle-compact" id="themeToggleButton" type="button" title="تفعيل الوضع الليلي" aria-label="تفعيل الوضع الليلي">
                      <span class="theme-toggle-icon" id="themeToggleIcon" aria-hidden="true"></span>
                    </button>
          '''
          if 'id="themeToggleButton"' not in index:
              refresh_anchor = '          <button class="ghost-btn" id="refreshPageButton"'
              require(index, refresh_anchor, "refresh button anchor")
              index = index.replace(refresh_anchor, theme_button + refresh_anchor, 1)
          
          card_settings = r'''      <section class="settings-section salary-card-appearance-section" id="salaryCardAppearanceSection">
                  <div class="settings-section-head">
                    <div>
                      <h3>مظهر بطاقة الراتب</h3>
                      <p>الكلاسيكي يبقي البطاقة الحالية كما هي. التصاميم البنكية تضيف رقاقة EMV ذهبية واقعية وشهرًا حاليًا بصيغة MM/YY.</p>
                    </div>
                  </div>
                  <div class="salary-card-style-grid" id="salaryCardStyleGrid">
                    <button class="salary-card-style-choice" type="button" data-salary-card-style="classic">
                      <span class="salary-card-mini preview-classic"><i></i></span><strong>كلاسيكي</strong><small>التصميم الحالي</small>
                    </button>
                    <button class="salary-card-style-choice" type="button" data-salary-card-style="emerald">
                      <span class="salary-card-mini preview-emerald"><i></i></span><strong>Emerald</strong><small>أخضر مصرفي</small>
                    </button>
                    <button class="salary-card-style-choice" type="button" data-salary-card-style="obsidian">
                      <span class="salary-card-mini preview-obsidian"><i></i></span><strong>Obsidian</strong><small>أسود فاخر</small>
                    </button>
                    <button class="salary-card-style-choice" type="button" data-salary-card-style="midnight">
                      <span class="salary-card-mini preview-midnight"><i></i></span><strong>Midnight</strong><small>كحلي عميق</small>
                    </button>
                    <button class="salary-card-style-choice" type="button" data-salary-card-style="ivory">
                      <span class="salary-card-mini preview-ivory"><i></i></span><strong>Ivory</strong><small>عاجي راقٍ</small>
                    </button>
                    <button class="salary-card-style-choice" type="button" data-salary-card-style="burgundy">
                      <span class="salary-card-mini preview-burgundy"><i></i></span><strong>Burgundy</strong><small>عنابي فاخر</small>
                    </button>
                  </div>
                  <div class="settings-status" id="salaryCardStyleStatus">يمكن تغيير التصميم في أي وقت دون التأثير على بيانات الراتب.</div>
                </section>
          
          '''
          if 'id="salaryCardStyleGrid"' not in index:
              notification_anchor = '''      <section class="settings-section">
                  <div class="settings-section-head"><div><h3>إشعارات التحديثات</h3>'''
              require(index, notification_anchor, "settings notification section")
              index = index.replace(notification_anchor, card_settings + notification_anchor, 1)
          
          old_current = '''        <section class="changelog-entry current">
                    <div class="changelog-version">
                      <strong>الإصدار 3.9.3</strong>'''
          new_current = '''        <section class="changelog-entry current">
                    <div class="changelog-version">
                      <strong>الإصدار 3.9.4</strong>
                      <time datetime="2026-09-04">4 سبتمبر 2026</time>
                    </div>
                    <ul>
                      <li>استبدال أحرف المصروفات بأيقونات SVG مرتبطة بنوع العملية واسم التاجر، دون تغيير بنية صف المصروف.</li>
                      <li>إضافة تمييز بصري ذكي لأنشطة مثل الفندق والسينما والمغسلة والقهوة والمطعم والوقود والمواقف والصحة والتوصيل.</li>
                      <li>إضافة وضع ليلي منظم بألوان أخضر داكن وفحمي مع زر قمر/شمس صغير ومتناسق في الشريط العلوي.</li>
                      <li>إضافة تصاميم مصرفية اختيارية لبطاقة الراتب من الإعدادات، مع الإبقاء على التصميم الكلاسيكي الأصلي.</li>
                      <li>التصاميم المصرفية تستخدم رقاقة EMV ذهبية مفصلة وشهرًا حاليًا بصيغة MM/YY، وتخفي موعد الراتب القديم داخل البطاقة لمنع التداخل.</li>
                      <li>عند إيقاف الاعتماد التلقائي يمكن اختيار أيقونة العملية البنكية أو Wallet قبل اعتمادها، ويحفظ الاختيار داخل المصروف.</li>
                      <li>إنشاء أرشيف كامل للإصدار المستقر 3.9.3 r7 قبل التحديث لضمان الرجوع الآمن عند رفض النسخة التجريبية.</li>
                    </ul>
                  </section>
                  <section class="changelog-entry">
                    <div class="changelog-version">
                      <strong>الإصدار 3.9.3</strong>'''
          index = replace_once(index, old_current, new_current, "3.9.3 changelog current entry")
          
          css = r'''
              /* 3.9.4 Clean Rebuild — scoped visuals only */
              .theme-toggle-compact{width:42px;min-width:42px;height:42px;min-height:42px;padding:0;flex:0 0 42px}
              .theme-toggle-icon{width:19px;height:19px;display:grid;place-items:center}
              .theme-toggle-icon svg{width:19px;height:19px;display:block;fill:none;stroke:currentColor;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round}
          
              .expense-category.expense-category-visual{display:grid;place-items:center;overflow:hidden;font-size:0}
              .expense-category.expense-category-visual svg{width:23px;height:23px;display:block;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
          
              .automation-visual-editor{display:grid;grid-template-columns:34px auto minmax(120px,1fr);align-items:center;gap:8px;margin-top:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:rgba(255,253,249,.72);color:var(--muted);font-size:10px;font-weight:800}
              .automation-visual-preview{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;color:var(--teal);background:var(--teal-soft)}
              .automation-visual-preview svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
              .automation-visual-editor select{width:100%;min-height:36px;padding:5px 9px;border:1px solid var(--line);border-radius:10px;color:var(--ink);background:var(--paper);font-size:11px;font-weight:800}
          
              .salary-card-style-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:13px}
              .salary-card-style-choice{appearance:none;min-width:0;padding:9px;border:1px solid var(--line);border-radius:15px;color:var(--ink);background:var(--paper);cursor:pointer;text-align:center;transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease}
              .salary-card-style-choice:active{transform:scale(.98)}
              .salary-card-style-choice.is-active{border-color:var(--teal);box-shadow:0 0 0 2px rgba(20,117,108,.12)}
              .salary-card-style-choice strong,.salary-card-style-choice small{display:block}
              .salary-card-style-choice strong{margin-top:7px;font-size:11px}
              .salary-card-style-choice small{margin-top:2px;color:var(--muted);font-size:9px}
              .salary-card-mini{position:relative;display:block;width:100%;aspect-ratio:1.62/1;overflow:hidden;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
              .salary-card-mini i{position:absolute;top:10px;left:10px;width:23px;height:17px;border-radius:4px;background:linear-gradient(90deg,transparent 31%,rgba(100,70,10,.42) 31% 35%,transparent 35% 65%,rgba(100,70,10,.42) 65% 69%,transparent 69%),linear-gradient(#f7e5a0,#c99725);box-shadow:inset 0 0 0 1px rgba(115,80,10,.28),0 2px 4px rgba(0,0,0,.12)}
              .preview-classic{background:linear-gradient(135deg,#123f3b,#0f5c55)}
              .preview-emerald{background:linear-gradient(135deg,#063b36,#087167)}
              .preview-obsidian{background:linear-gradient(135deg,#0d1112,#2c3233)}
              .preview-midnight{background:linear-gradient(135deg,#0b1526,#183d5b)}
              .preview-ivory{background:linear-gradient(135deg,#f1efe5,#bfc4c0)}
              .preview-burgundy{background:linear-gradient(135deg,#42101f,#823146)}
          
              .salary-card.salary-card-bank{isolation:isolate;min-height:275px;padding-top:88px;border:1px solid rgba(255,255,255,.11);box-shadow:0 22px 52px rgba(12,35,32,.19)}
              .salary-card.salary-card-bank .hero-kicker{position:absolute;top:27px;right:28px;max-width:52%;margin:0;z-index:4}
              .salary-card.salary-card-bank .salary-payday-chip{display:none!important}
              .salary-card.salary-card-bank .bank-card-hardware{position:absolute;top:21px;left:25px;z-index:5;display:flex;align-items:center;gap:10px;direction:ltr}
              .bank-card-emv{width:57px;height:43px;display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.16))}
              .bank-card-current-month{min-width:48px;color:rgba(255,255,255,.88);font-family:ui-monospace,"SFMono-Regular",Menlo,Monaco,monospace;font-size:13px;font-weight:800;letter-spacing:.08em;text-shadow:0 1px 2px rgba(0,0,0,.18)}
              .salary-card.salary-card-bank::before{content:"";position:absolute;inset:0;z-index:-2;pointer-events:none;background:linear-gradient(118deg,rgba(255,255,255,.085),transparent 25%,transparent 70%,rgba(255,255,255,.045)),radial-gradient(circle at 82% 11%,rgba(255,255,255,.09),transparent 28%)}
              .salary-card-style-emerald{background:linear-gradient(135deg,#063a35 0%,#087269 56%,#0b4b45 100%)}
              .salary-card-style-obsidian{background:linear-gradient(135deg,#0b0f10 0%,#272d2e 55%,#121718 100%)}
              .salary-card-style-midnight{background:linear-gradient(135deg,#0b1424 0%,#163d5d 58%,#10283c 100%)}
              .salary-card-style-burgundy{background:linear-gradient(135deg,#3d0d1c 0%,#7f2d42 57%,#4b1022 100%)}
              .salary-card-style-ivory{color:#172f2c;background:linear-gradient(135deg,#f2f0e8 0%,#d6d9d3 52%,#aeb7b5 100%);border-color:rgba(23,51,49,.12)}
              .salary-card-style-ivory .hero-kicker,.salary-card-style-ivory .salary-label,.salary-card-style-ivory .bank-card-current-month{color:rgba(23,47,44,.67);text-shadow:none}
              .salary-card-style-ivory .salary-value{color:#173331}
              .salary-card-style-ivory .live-dot{background:#14756c;box-shadow:0 0 0 5px rgba(20,117,108,.11)}
              .salary-card-style-ivory .edit-salary{color:#173331;border-color:rgba(23,51,49,.14);background:rgba(255,255,255,.30)}
          
              html[data-app-theme="dark"]{color-scheme:dark;--ink:#eef5f2;--muted:#9caaa6;--line:#2a3a37;--paper:#172321;--canvas:#0d1514;--forest:#174d47;--teal:#45aa98;--teal-soft:#1c3934;--coral:#ee8a69;--coral-soft:#3a2823;--gold:#d8b45b;--gold-soft:#342f22;--red:#f08a83;--shadow:0 18px 48px rgba(0,0,0,.28)}
              html[data-app-theme="dark"] body{background:radial-gradient(circle at 88% 2%,rgba(69,170,152,.09),transparent 25rem),radial-gradient(circle at 5% 35%,rgba(216,180,91,.055),transparent 22rem),var(--canvas)}
              html[data-app-theme="dark"] .topbar{background:rgba(13,21,20,.91);border-bottom-color:rgba(255,255,255,.055)}
              html[data-app-theme="dark"] .month-control,html[data-app-theme="dark"] .ghost-btn{color:var(--ink);background:rgba(23,35,33,.88);border-color:var(--line)}
              html[data-app-theme="dark"] .ghost-btn:hover,html[data-app-theme="dark"] .icon-btn:hover{background:#21302d;border-color:#3b4a47}
          SALARY394_PART_1_X9

      - name: Prepare clean 3.9.4 patch 2/4
        shell: bash
        run: |
          cat >> /tmp/salary-manager-394-clean.py <<'SALARY394_PART_2_X9'
              html[data-app-theme="dark"] .panel,html[data-app-theme="dark"] .available-card,html[data-app-theme="dark"] .summary-card,html[data-app-theme="dark"] .tabs,html[data-app-theme="dark"] dialog.modal,html[data-app-theme="dark"] .settings-section,html[data-app-theme="dark"] .account-card,html[data-app-theme="dark"] .admin-user,html[data-app-theme="dark"] .automation-import,html[data-app-theme="dark"] .automation-connect-card,html[data-app-theme="dark"] .statement-card,html[data-app-theme="dark"] .expense-item,html[data-app-theme="dark"] .commitment-card,html[data-app-theme="dark"] .recurring-card,html[data-app-theme="dark"] .upcoming-item,html[data-app-theme="dark"] .backup-menu{color:var(--ink);background-color:var(--paper);border-color:var(--line)}
