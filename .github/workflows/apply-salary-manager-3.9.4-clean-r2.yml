                  travel:'<svg viewBox="0 0 24 24"><path d="m2 16 8-4V5l2-2 2 2v7l8 4v2l-8-2v4l2 2v1l-4-1-4 1v-1l2-2v-4l-8 2v-2Z"/></svg>',
