                  cinema:'<svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="12" rx="2"/><path d="m4 7 3-4M9 7l3-4M14 7l3-4M19 7l2-3"/></svg>',
                  hotel:'<svg viewBox="0 0 24 24"><path d="M4 20V5h9v15M13 10h7v10"/><path d="M7 8h2M7 12h2M16 13h2M16 17h2"/></svg>',
                  parking:'<svg viewBox="0 0 24 24"><path d="M7 21V3h6a4 4 0 0 1 0 8H7"/></svg>',
                  telecom:'<svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M10 5h4M11 18h2"/></svg>',
                  health:'<svg viewBox="0 0 24 24"><path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 11c0 5.6-7 10-7 10Z"/><path d="M9 12h2l1-2 1 4 1-2h2"/></svg>',
