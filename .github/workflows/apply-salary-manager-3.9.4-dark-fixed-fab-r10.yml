name: Apply Salary Manager 3.9.4 Dark Fixed FAB r10

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-salary-manager-3.9.4-dark-fixed-fab-r10.yml"

permissions:
  contents: write

jobs:
  patch-test-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current r8
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify current staged source is r8
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'var APP_VERSION = "3.9.4";' public/index.html
          grep -Fq 'var APP_RELEASE_ID = "3.9.4-card-layout-r8";' public/index.html
          grep -Fq 'const RELEASE_ID = "3.9.4-card-layout-r8";' src/worker.js
          grep -Fq 'const UPDATE_SIGNAL_VERSION = "3.9.4\u2060";' src/worker.js
          grep -Fq 'salary-manager-v3.9.4-card-layout-r8' public/sw.js
          test -f public/releases/3.9.3-autoapprove-sync-race-r7/app.html

      - name: Prepare r10 patch
        shell: bash
        run: |
          printf '%s' '' > /tmp/salary-r10-patch.b64

      - name: Decode and apply r10 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d /tmp/salary-r10-patch.b64 > /tmp/salary-r10-patch.py
          python3 -m py_compile /tmp/salary-r10-patch.py
          python3 /tmp/salary-r10-patch.py

      - name: Validate JavaScript and requested fixes
        shell: bash
        run: |
          set -euo pipefail
          node --check src/worker.js
          node --check public/sw.js
          python3 - <<'PY2'
          from pathlib import Path
          import re
          text=Path('public/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S|re.I)
          Path('/tmp/salary-r10-inline.js').write_text('\n'.join(x for x in blocks if x.strip()),encoding='utf-8')
          PY2
          node --check /tmp/salary-r10-inline.js
          grep -Fq 'var APP_RELEASE_ID = "3.9.4-dark-fixed-fab-r10";' public/index.html
          grep -Fq '3.9.4 r10 — fixed viewport actions + complete dark surfaces' public/index.html
          grep -Fq 'id="r10ViewportDarkFix"' public/index.html
          grep -Fq 'position:fixed!important' public/index.html
          grep -Fq 'expense-category-choice.is-selected' public/index.html
          grep -Fq 'const RELEASE_ID = "3.9.4-dark-fixed-fab-r10";' src/worker.js
          grep -Fq 'const UPDATE_SIGNAL_VERSION = "3.9.4\u2063";' src/worker.js
          grep -Fq 'salary-manager-v3.9.4-dark-fixed-fab-r10' public/sw.js

      - name: Commit staged r10
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/sw.js src/worker.js
          git commit -m "Salary Manager 3.9.4 r10 fix floating actions and dark surfaces"
          git push

      - name: Deploy staged r10 to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
          secrets: |
            AUTH_PEPPER
            OWNER_BOOTSTRAP_TOKEN
        env:
          AUTH_PEPPER: ${{ secrets.AUTH_PEPPER }}
          OWNER_BOOTSTRAP_TOKEN: ${{ secrets.OWNER_BOOTSTRAP_TOKEN }}

      - name: Verify exact r10 is live
        shell: bash
        run: |
          set -euo pipefail
          URL="https://salary-manager.alromaithi-3bo0d.workers.dev/api/health"
          BODY=""
          for i in $(seq 1 90); do
            BODY=$(curl -fsS --max-time 8 "${URL}?r10_check=$(date +%s)" || true)
            echo "$BODY"
            if echo "$BODY" | grep -Fq '"version":"3.9.4"' && echo "$BODY" | grep -Fq '"stagedReleaseId":"3.9.4-dark-fixed-fab-r10"'; then break; fi
            sleep 4
          done
          echo "$BODY" | grep -Fq '"stagedReleaseId":"3.9.4-dark-fixed-fab-r10"'

      - name: Verify public users remain on stable r7
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(curl -fsSL --max-time 15 "https://salary-manager.alromaithi-3bo0d.workers.dev/?public_r10_check=$(date +%s)")
          echo "$BODY" | grep -Fq '3.9.3-autoapprove-sync-race-r7'
          if echo "$BODY" | grep -Fq '3.9.4-dark-fixed-fab-r10'; then
            echo "SECURITY FAILURE: staged r10 leaked to public users" >&2
            exit 1
          fi

      - name: Summary
        run: |
          echo "### Salary Manager 3.9.4 r10" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Fixed the Python re.sub unicode-escape failure from r9" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Floating action buttons pinned to the viewport bottom-right" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Stack moved to document.body to avoid transformed-parent fixed-position bugs" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Expense form, fields, category cards, settings and other bright surfaces darkened" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Owner-only staging retained; public users stay on stable 3.9.3 r7" >> "$GITHUB_STEP_SUMMARY"
