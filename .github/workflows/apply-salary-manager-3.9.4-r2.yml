                function getSalaryCardStyle() {
                  var style = "";
                  try { style = localStorage.getItem(SALARY_CARD_STYLE_KEY) || ""; } catch (_) {}
                  return SALARY_CARD_STYLES.indexOf(style) !== -1 ? style : "classic";
