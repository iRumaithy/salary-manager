name: Apply Salary Manager 3.9.4 r2 Repair

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-salary-manager-3.9.4-r2.yml"

permissions:
  contents: write

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply 3.9.4 r2 repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          INDEX = Path("public/index.html")
          WORKER = Path("src/worker.js")
          SW = Path("public/sw.js")
          PACKAGE = Path("package.json")

          OLD_RELEASE = "3.9.4-smart-visuals-dark-cards-r1"
          NEW_RELEASE = "3.9.4-polished-theme-cards-icons-r2"

          def read(path):
              return path.read_text(encoding="utf-8")

          def write(path, text):
              path.write_text(text, encoding="utf-8")

          def require(text, needle, label):
              if needle not in text:
                  raise SystemExit("Patch failed — missing " + label)

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit("Patch failed — missing " + label)
              return text.replace(old, new, 1)

          index = read(INDEX)

          index, css_removed = re.subn(
              r'\n\s*/\* 3\.9\.4 r1 — smart visuals, dark mode, premium salary card skins \*/.*?(?=\n\s*</style>)',
              '',
              index,
              count=1,
              flags=re.S
          )
          if css_removed != 1:
              raise SystemExit("Patch failed — could not remove r1 CSS layer")

          index, js_removed = re.subn(
              r'\n\s*/\* 3\.9\.4 r1 — smart visuals, theme toggle, bank-card skins \*/.*?(?=\n\s*function renderExpenses\(items\) \{)',
              '\n',
              index,
              count=1,
              flags=re.S
          )
          if js_removed != 1:
              raise SystemExit("Patch failed — could not remove r1 JS layer")

          index = index.replace(OLD_RELEASE, NEW_RELEASE)
          index = replace_once(
              index,
              'var APP_RELEASE_ID = "3.9.4-smart-visuals-dark-cards-r1";',
              'var APP_RELEASE_ID = "3.9.4-polished-theme-cards-icons-r2";',
              "APP_RELEASE_ID"
          )

          theme_button = '''          <button class="ghost-btn theme-toggle-compact" id="themeToggleButton" type="button" title="الوضع الليلي" aria-label="الوضع الليلي">
                      <span class="theme-toggle-icon" id="themeToggleIcon" aria-hidden="true"></span>
                    </button>
          '''
          if 'id="themeToggleButton"' not in index:
              anchor = '          <button class="ghost-btn" id="refreshPageButton"'
              require(index, anchor, "refreshPageButton anchor")
              index = index.replace(anchor, theme_button + anchor, 1)

          settings_section = '''      <section class="settings-section salary-card-settings-section" id="salaryCardAppearanceSettings">
                  <div class="settings-section-head">
                    <div>
                      <h3>مظهر بطاقة الراتب</h3>
                      <p>اختر الشكل الذي يناسبك. «الكلاسيكي» يبقي البطاقة الحالية كما هي، والتصاميم البنكية تضيف رقاقة ذهبية واقعية وشهرًا حاليًا بصيغة MM/YY.</p>
                    </div>
                  </div>
                  <div class="salary-card-style-grid" id="salaryCardStyleGrid">
                    <button class="salary-card-style-choice" type="button" data-salary-card-style="classic"><span class="salary-card-preview preview-classic"><i></i></span><strong>كلاسيكي</strong><small>الشكل الأصلي</small></button>
                    <button class="salary-card-style-choice" type="button" data-salary-card-style="emerald"><span class="salary-card-preview preview-emerald"><i></i></span><strong>Emerald</strong><small>أخضر بنكي</small></button>
                    <button class="salary-card-style-choice" type="button" data-salary-card-style="obsidian"><span class="salary-card-preview preview-obsidian"><i></i></span><strong>Obsidian</strong><small>أسود فاخر</small></button>
                    <button class="salary-card-style-choice" type="button" data-salary-card-style="midnight"><span class="salary-card-preview preview-midnight"><i></i></span><strong>Midnight</strong><small>كحلي عميق</small></button>
                    <button class="salary-card-style-choice" type="button" data-salary-card-style="platinum"><span class="salary-card-preview preview-platinum"><i></i></span><strong>Platinum</strong><small>فضي هادئ</small></button>
                    <button class="salary-card-style-choice" type="button" data-salary-card-style="burgundy"><span class="salary-card-preview preview-burgundy"><i></i></span><strong>Burgundy</strong><small>عنابي فاخر</small></button>
                  </div>
                </section>

          '''
          if 'id="salaryCardStyleGrid"' not in index:
              automation_anchor = '''      <section class="settings-section">
                  <div class="settings-section-head"><div><h3>الربط التلقائي · Wallet والبنك</h3>'''
              require(index, automation_anchor, "automation settings anchor")
              index = index.replace(automation_anchor, settings_section + automation_anchor, 1)

          css = r'''
              /* 3.9.4 r2 — scoped appearance repair */
              html[data-theme="dark"] {
                --ink: #eef5f2;
                --muted: #9caaa6;
                --line: #2a3a37;
                --paper: #172321;
                --canvas: #0d1514;
                --forest: #174d47;
                --teal: #39a895;
                --teal-soft: #1d3935;
                --coral: #ef8b68;
                --coral-soft: #3b2924;
                --gold: #d8b45b;
                --gold-soft: #342f22;
                --red: #f08a83;
                --shadow: 0 18px 48px rgba(0, 0, 0, .30);
              }
              html[data-theme="dark"] body {
                background:
                  radial-gradient(circle at 88% 2%, rgba(54, 167, 148, .10), transparent 25rem),
                  radial-gradient(circle at 5% 35%, rgba(216, 180, 91, .07), transparent 22rem),
                  var(--canvas);
              }
              html[data-theme="dark"] .topbar { background: rgba(13,21,20,.92); border-bottom-color: rgba(255,255,255,.06); }
              html[data-theme="dark"] .ghost-btn { color: var(--ink); background: rgba(23,35,33,.86); border-color: var(--line); }
              html[data-theme="dark"] .ghost-btn:hover,
              html[data-theme="dark"] .icon-btn:hover { background: #20302d; border-color: #3b4b47; }
              html[data-theme="dark"] .available-card,
              html[data-theme="dark"] .panel,
              html[data-theme="dark"] dialog.modal,
              html[data-theme="dark"] .settings-section,
              html[data-theme="dark"] .statement-card,
              html[data-theme="dark"] .quick-form,
              html[data-theme="dark"] .month-picker-shell,
              html[data-theme="dark"] .tabs { color: var(--ink); background-color: var(--paper); border-color: var(--line); }
              html[data-theme="dark"] .field input,
              html[data-theme="dark"] .field select,
              html[data-theme="dark"] .field textarea,
              html[data-theme="dark"] input,
              html[data-theme="dark"] select,
              html[data-theme="dark"] textarea { color: var(--ink); background-color: #111d1b; border-color: var(--line); }
              html[data-theme="dark"] .danger-btn { color: #f3a19a; background: #3b2423; }
              html[data-theme="dark"] .soft-btn { color: #91ded0; background: #1d3935; }
              html[data-theme="dark"] .expense-category,
              html[data-theme="dark"] .expense-category-logo { background: #1d3935; color: #a9e7dc; }

              .theme-toggle-compact {
                width: 42px;
                min-width: 42px;
                height: 42px;
                min-height: 42px;
                padding: 0;
                flex: 0 0 42px;
              }
              .theme-toggle-icon { width: 19px; height: 19px; display: grid; place-items: center; }
              .theme-toggle-icon svg {
                width: 19px; height: 19px; display: block; fill: none; stroke: currentColor;
                stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
              }

              .expense-category.expense-category-icon { display: grid; place-items: center; overflow: hidden; font-size: 0; }
              .expense-category.expense-category-icon svg {
                width: 23px; height: 23px; display: block; fill: none; stroke: currentColor;
                stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;
              }

              .salary-card-style-grid {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 10px;
                margin-top: 13px;
              }
              .salary-card-style-choice {
                appearance: none;
                min-width: 0;
                padding: 9px;
                border: 1px solid var(--line);
                border-radius: 15px;
                color: var(--ink);
                background: var(--paper);
                cursor: pointer;
                text-align: center;
              }
              .salary-card-style-choice.is-active { border-color: var(--teal); box-shadow: 0 0 0 2px rgba(20,117,108,.12); }
              .salary-card-style-choice strong,
              .salary-card-style-choice small { display: block; }
              .salary-card-style-choice strong { margin-top: 7px; font-size: 12px; }
              .salary-card-style-choice small { margin-top: 2px; color: var(--muted); font-size: 10px; }

              .salary-card-preview {
                position: relative;
                width: 100%;
                aspect-ratio: 1.7 / 1;
                display: block;
                overflow: hidden;
                border-radius: 9px;
                box-shadow: inset 0 0 0 1px rgba(255,255,255,.13);
              }
              .salary-card-preview i {
                position: absolute;
                top: 11px; left: 11px;
                width: 22px; height: 16px;
                border-radius: 4px;
                background:
                  linear-gradient(90deg, transparent 31%, rgba(100,70,10,.34) 31% 35%, transparent 35% 65%, rgba(100,70,10,.34) 65% 69%, transparent 69%),
                  linear-gradient(#f5dc8b, #c89b30);
                box-shadow: inset 0 0 0 1px rgba(109,79,17,.24);
              }
              .preview-classic { background: linear-gradient(135deg, #123f3b, #0f5c55); }
              .preview-emerald { background: linear-gradient(135deg, #0a413d, #0b776d); }
              .preview-obsidian { background: linear-gradient(135deg, #101314, #292f30); }
              .preview-midnight { background: linear-gradient(135deg, #101a2b, #163b5a); }
              .preview-platinum { background: linear-gradient(135deg, #d9d9d4, #9fa7a8); }
              .preview-burgundy { background: linear-gradient(135deg, #4e1426, #8a3143); }

              .salary-card.salary-card-bank {
                isolation: isolate;
                min-height: 268px;
                padding-top: 76px;
                border: 1px solid rgba(255,255,255,.12);
                box-shadow: 0 22px 50px rgba(17,38,36,.18);
              }
              .salary-card.salary-card-bank::before {
                content: "";
                position: absolute;
                inset: 0;
                z-index: -2;
                background:
                  linear-gradient(115deg, rgba(255,255,255,.09), transparent 24%, transparent 68%, rgba(255,255,255,.045)),
                  radial-gradient(circle at 82% 12%, rgba(255,255,255,.10), transparent 27%);
                pointer-events: none;
              }
              .salary-card.salary-card-bank::after { z-index: -1; opacity: .55; }
              .salary-card-style-emerald { background: linear-gradient(135deg, #073f3a 0%, #0a6e65 58%, #0e4f49 100%); }
              .salary-card-style-obsidian { background: linear-gradient(135deg, #0c0f10 0%, #252a2b 55%, #131819 100%); }
              .salary-card-style-midnight { background: linear-gradient(135deg, #0d1728 0%, #173c5c 58%, #12273b 100%); }
              .salary-card-style-platinum { color: #172321; background: linear-gradient(135deg, #ecece7 0%, #c6cbcb 50%, #a7afb0 100%); border-color: rgba(23,35,33,.12); }
              .salary-card-style-burgundy { background: linear-gradient(135deg, #42101f 0%, #7c2c3e 58%, #4f1425 100%); }

              .salary-card-bank .salary-payday-chip { display: none !important; }
              .salary-card-bank .bank-card-hardware {
                position: absolute;
                top: 22px;
                left: 24px;
                z-index: 4;
                display: flex;
                align-items: center;
                gap: 12px;
                direction: ltr;
              }
              .salary-card-bank .bank-card-chip-svg { width: 58px; height: 44px; display: block; filter: drop-shadow(0 4px 6px rgba(0,0,0,.13)); }
              .salary-card-bank .bank-card-month {
                min-width: 44px;
                color: rgba(255,255,255,.88);
                font-family: "SF Mono", "Roboto Mono", ui-monospace, monospace;
                font-size: 13px;
                font-weight: 700;
                letter-spacing: .08em;
                text-shadow: 0 1px 1px rgba(0,0,0,.12);
              }
              .salary-card-style-platinum .hero-kicker,
              .salary-card-style-platinum .salary-label,
              .salary-card-style-platinum .allocation-copy span,
              .salary-card-style-platinum .mini-progress-head,
              .salary-card-style-platinum .bank-card-month { color: rgba(23,35,33,.66); text-shadow: none; }
              .salary-card-style-platinum .salary-value,
              .salary-card-style-platinum .allocation-copy strong { color: #172321; }
              .salary-card-style-platinum .edit-salary { color: #172321; border-color: rgba(23,35,33,.16); background: rgba(255,255,255,.30); }
              .salary-card-style-platinum .mini-progress-track { background: rgba(23,35,33,.12); }

              .automation-icon-editor {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-top: 8px;
                color: var(--muted);
                font-size: 11px;
                font-weight: 700;
              }
              .automation-icon-editor select {
                min-height: 34px;
                max-width: 170px;
                padding: 5px 28px 5px 9px;
                border: 1px solid var(--line);
                border-radius: 10px;
                color: var(--ink);
                background: var(--paper);
                font: inherit;
              }

              @media (max-width: 720px) {
                .salary-card-style-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
                .salary-card.salary-card-bank { min-height: 286px; padding: 76px 22px 22px; }
                .salary-card-bank .bank-card-hardware { top: 20px; left: 20px; }
                .salary-card-bank .bank-card-chip-svg { width: 54px; height: 41px; }
              }
          '''
          index = replace_once(index, '  </style>', css + '\n  </style>', "style closing tag")

          js = r'''
                /* 3.9.4 r2 — integrated theme, card and expense visuals */
                var SALARY_THEME_KEY = "monthlySalaryManager.theme.v2";
                var SALARY_CARD_STYLE_KEY = "monthlySalaryManager.salaryCardStyle.v2";
                var SALARY_CARD_STYLES = ["classic","emerald","obsidian","midnight","platinum","burgundy"];
                var automationPendingIconOverrides = Object.create(null);

                var expenseVisualIcons = {
                  shopping:'<svg viewBox="0 0 24 24"><path d="M6 8h12l-1 11H7L6 8Z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>',
                  restaurant:'<svg viewBox="0 0 24 24"><path d="M6 3v8M4 3v5a2 2 0 0 0 4 0V3M12 3v18M16 3c2 2 2 5 0 7h-2V3Z"/></svg>',
                  fuel:'<svg viewBox="0 0 24 24"><path d="M4 7h10v12H4Z"/><path d="M6 10h6M14 9h2l3 3v5a2 2 0 0 0 4 0v-6l-2-2"/></svg>',
                  bills:'<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6"/></svg>',
                  phone:'<svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>',
                  health:'<svg viewBox="0 0 24 24"><path d="M12 21s-7-4.3-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 11c0 5.7-7 10-7 10Z"/><path d="M9 12h2l1-2 1 4 1-2h2"/></svg>',
                  cinema:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 3v6M12 3v6M17 3v6"/></svg>',
                  coffee:'<svg viewBox="0 0 24 24"><path d="M5 8h10v5a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V8Z"/><path d="M15 9h2a2.5 2.5 0 0 1 0 5h-2M8 3v2M12 3v2"/></svg>',
                  hotel:'<svg viewBox="0 0 24 24"><path d="M4 20V5h9v15M13 10h7v10"/><path d="M7 8h2M7 12h2M16 13h2M16 17h2"/></svg>',
                  laundry:'<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="13" r="4.5"/><path d="M8 6h.01M11 6h4"/></svg>',
                  parking:'<svg viewBox="0 0 24 24"><path d="M7 21V3h6a4 4 0 0 1 0 8H7"/></svg>',
                  delivery:'<svg viewBox="0 0 24 24"><path d="M3 7h11v10H3ZM14 11h4l3 3v3h-7Z"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>',
                  home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>',
                  gift:'<svg viewBox="0 0 24 24"><path d="M4 10h16v10H4ZM12 10v10M4 14h16"/><path d="M12 10H8a2 2 0 1 1 0-4c2 0 4 4 4 4ZM12 10h4a2 2 0 1 0 0-4c-2 0-4 4-4 4Z"/></svg>',
                  salon:'<svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="3"/><circle cx="6" cy="17" r="3"/><path d="M8.5 8.5 21 3M8.5 15.5 21 21M10 12h4"/></svg>',
                  sport:'<svg viewBox="0 0 24 24"><path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/></svg>',
                  gov:'<svg viewBox="0 0 24 24"><path d="m3 9 9-5 9 5M5 10v8M10 10v8M14 10v8M19 10v8M3 20h18"/></svg>',
                  travel:'<svg viewBox="0 0 24 24"><path d="m2 16 8-4V5l2-2 2 2v7l8 4v2l-8-2v4l2 2v1l-4-1-4 1v-1l2-2v-4l-8 2v-2Z"/></svg>',
                  other:'<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>'
                };

                var expenseCategoryVisualMap = {
                  "مشتريات":"shopping","طعام":"restaurant","مواصلات":"fuel","فواتير":"bills","اتصالات":"phone","صحة":"health",
                  "ترفيه":"cinema","قهوة":"coffee","ملابس":"shopping","منزل":"home","سفر":"travel","تعليم":"other","هدايا":"gift",
                  "مغسلة ملابس":"laundry","عناية شخصية":"salon","صيانة سيارة":"fuel","خدمات منزلية":"home","توصيل":"delivery",
                  "أطفال وعائلة":"other","حيوانات أليفة":"other","مناسبات":"gift","فندق":"hotel","سينما":"cinema","اشتراكات":"bills",
                  "مواقف":"parking","رياضة":"sport","رسوم حكومية":"gov","أخرى":"other"
                };

                var expenseMerchantVisualRules = [
                  { key:"fuel", words:["adnoc","ادنوك","enoc","eppco","petrol","fuel","محطة"] },
                  { key:"laundry", words:["laundry","dry clean","dryclean","مغسلة","مغسله","دراي كلين"] },
                  { key:"cinema", words:["vox","reel cinema","cinema","movie","سينما","ريل"] },
                  { key:"hotel", words:["hotel","resort","hilton","marriott","booking","rotana","فندق","منتجع"] },
                  { key:"coffee", words:["starbucks","coffee","cafe","café","كوفي","قهوة"] },
                  { key:"restaurant", words:["restaurant","burger","grill","shawarma","مطعم","برجر","شاورما"] },
                  { key:"parking", words:["parking","mawaqif","مواقف"] },
                  { key:"phone", words:["etisalat","e&","du telecom","virgin mobile","اتصالات"] },
                  { key:"health", words:["pharmacy","hospital","clinic","صيدلية","مستشفى","عيادة"] },
                  { key:"delivery", words:["talabat","deliveroo","careem food","noon food","توصيل"] },
                  { key:"salon", words:["salon","barber","spa","صالون","حلاق","سبا"] },
                  { key:"sport", words:["gym","fitness","crossfit","نادي رياضي","رياضة"] },
                  { key:"gov", words:["tamm","darb","rta","moi","government","رسوم حكومية"] }
                ];

                function normalizeExpenseVisualText(value) {
                  return String(value || "").toLowerCase().replace(/\s+/g, " ").trim();
                }

                function expenseVisualKey(title, category, explicitKey) {
                  explicitKey = String(explicitKey || "");
                  if (expenseVisualIcons[explicitKey]) return explicitKey;
                  var text = normalizeExpenseVisualText(title);
                  for (var i = 0; i < expenseMerchantVisualRules.length; i += 1) {
                    var rule = expenseMerchantVisualRules[i];
                    for (var j = 0; j < rule.words.length; j += 1) {
                      if (text.indexOf(normalizeExpenseVisualText(rule.words[j])) !== -1) return rule.key;
                    }
                  }
                  return expenseCategoryVisualMap[String(category || "أخرى")] || "other";
                }

                function expenseVisualSvgForItem(item) {
                  var key = expenseVisualKey(item && item.title, item && item.category, item && item.visualIcon);
                  return expenseVisualIcons[key] || expenseVisualIcons.other;
                }

                function themeIconSvg(mode) {
                  if (mode === "dark") {
                    return '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
                  }
                  return '<svg viewBox="0 0 24 24"><path d="M20.3 15.3A8.4 8.4 0 0 1 8.7 3.7 8.7 8.7 0 1 0 20.3 15.3Z"/></svg>';
                }

                function getSalaryTheme() {
                  var mode = "";
                  try { mode = localStorage.getItem(SALARY_THEME_KEY) || ""; } catch (_) {}
                  return mode === "dark" ? "dark" : "light";
                }

                function applySalaryTheme(mode) {
                  mode = mode === "dark" ? "dark" : "light";
                  document.documentElement.setAttribute("data-theme", mode);
                  try { localStorage.setItem(SALARY_THEME_KEY, mode); } catch (_) {}
                  var icon = document.getElementById("themeToggleIcon");
                  var button = document.getElementById("themeToggleButton");
                  if (icon) icon.innerHTML = themeIconSvg(mode);
                  if (button) {
                    var label = mode === "dark" ? "العودة للوضع النهاري" : "تفعيل الوضع الليلي";
                    button.title = label;
                    button.setAttribute("aria-label", label);
                  }
                  var meta = document.querySelector('meta[name="theme-color"]');
                  if (meta) meta.setAttribute("content", mode === "dark" ? "#0d1514" : "#123f3b");
                }

                function bankChipSvg() {
                  return '<svg class="bank-card-chip-svg" viewBox="0 0 58 44" aria-hidden="true">' +
                    '<defs><linearGradient id="salaryChipGold" x1="0" y1="0" x2="1" y2="1">' +
