                    hardware.innerHTML = bankChipSvg() + '<span class="bank-card-month" aria-label="الشهر الحالي">' + currentCardMonthText() + '</span>';
                    card.appendChild(hardware);
                  } else {
                    var month = hardware.querySelector(".bank-card-month");
                    if (month) month.textContent = currentCardMonthText();
                  }
                  syncSalaryCardStyleButtons(style);
                }

