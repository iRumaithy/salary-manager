                function syncSalaryCardStyleButtons(style) {
                  document.querySelectorAll("[data-salary-card-style]").forEach(function (button) {
                    button.classList.toggle("is-active", button.dataset.salaryCardStyle === style);
                  });
                }

                function applySalaryCardStyle(style) {
                  style = SALARY_CARD_STYLES.indexOf(style) !== -1 ? style : "classic";
                  try { localStorage.setItem(SALARY_CARD_STYLE_KEY, style); } catch (_) {}
                  var card = document.querySelector(".salary-card");
                  if (!card) return;

                  SALARY_CARD_STYLES.forEach(function (name) { card.classList.remove("salary-card-style-" + name); });
                  card.classList.remove("salary-card-bank");

                  var hardware = card.querySelector(".bank-card-hardware");
                  if (style === "classic") {
                    if (hardware) hardware.remove();
                    syncSalaryCardStyleButtons(style);
                    return;
                  }

                  card.classList.add("salary-card-bank", "salary-card-style-" + style);
                  if (!hardware) {
                    hardware = document.createElement("div");
