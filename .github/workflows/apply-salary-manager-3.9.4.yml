      - name: Validate inline JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path("public/index.html").read_text(encoding="utf-8")
          blocks = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", text, flags=re.S|re.I)
          inline = "\n".join(block for block in blocks if block.strip())
          Path("/tmp/salary-inline-394.js").write_text(inline, encoding="utf-8")
          PY
          node --check /tmp/salary-inline-394.js

      - name: Commit patched source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/index.html public/sw.js src/worker.js
            git commit -m "Salary Manager 3.9.4: smart visuals, dark mode, salary card skins"
            git push
          fi

