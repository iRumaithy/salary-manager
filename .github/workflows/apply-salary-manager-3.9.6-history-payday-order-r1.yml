name: Apply Salary Manager 3.9.6 History + Payday Order r1

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-salary-manager-3.9.6-history-payday-order-r1.yml"
      - ".github/scripts/apply-salary-manager-3.9.6-history-payday-order-r1.py"

permissions:
  contents: write

jobs:
  patch-test-stage-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current r3
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify current staged source is r3
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'var APP_VERSION = "3.9.5";' public/index.html
          grep -Fq '3.9.5-outings-live-netting-r3' public/index.html
          grep -Fq 'const RELEASE_ID = "3.9.5-outings-live-netting-r3";' src/worker.js
          grep -Fq 'salary-manager-v3.9.5-outings-live-netting-r3' public/sw.js

      - name: Apply 3.9.6 r1 patch
        run: python3 .github/scripts/apply-salary-manager-3.9.6-history-payday-order-r1.py

      - name: Validate source and payday math
        shell: bash
        run: |
          set -euo pipefail
          node --check src/worker.js
          node --check public/sw.js
          grep -Fq 'var APP_VERSION = "3.9.6";' public/index.html
          grep -Fq '3.9.6-history-payday-order-r1' public/index.html
          grep -Fq 'carry-salary-commitments-v2' public/index.html
          grep -Fq 'applyLatePreviousMonthCashDelta' public/index.html
          grep -Fq 'hiddenFromStatement:true' public/index.html
          grep -Fq 'accountMonth:operationMonth' public/index.html
          grep -Fq 'const VERSION = "3.9.6";' src/worker.js
          grep -Fq 'const RELEASE_ID = "3.9.6-history-payday-order-r1";' src/worker.js
          grep -Fq 'salary-manager-v3.9.6-history-payday-order-r1' public/sw.js
          grep -Fq '"version": "3.9.6"' package.json

          node <<'JS'
          const assert = require('node:assert/strict');
          function payday(carry, salary, commitments, choice) {
            let savings = 0;
            let wallet = carry;
            if (choice === 'savings' && wallet > 0) {
              savings += wallet;
              wallet = 0;
            }
            wallet += salary;
            wallet -= commitments;
            return {wallet, savings};
          }
          assert.deepEqual(payday(500, 10000, 2500, 'keep'), {wallet:8000, savings:0});
          assert.deepEqual(payday(500, 10000, 2500, 'savings'), {wallet:7500, savings:500});
          assert.deepEqual(payday(0, 10000, 2500, 'keep'), {wallet:7500, savings:0});
          console.log('payday order regression OK');
          JS

          node <<'JS'
          const assert = require('node:assert/strict');
          const openingOct = 1200;
          const lateSepExpense = -75;
          assert.equal(openingOct + lateSepExpense, 1125);
          assert.equal(900 + lateSepExpense, 825);
          console.log('previous-month late import carry regression OK');
          JS

          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          text=Path('public/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S|re.I)
          for i,b in enumerate(blocks):
              if not b.strip():
                  continue
              p=Path(f'/tmp/r396-inline-{i}.js')
              p.write_text(b,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
          print('inline JS syntax OK')
          PY

      - name: Commit staged 3.9.6 r1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/sw.js src/worker.js package.json
          git commit -m "Salary Manager 3.9.6 r1 allow previous-month imports and enforce payday order"
          git push

      - name: Deploy staged 3.9.6 r1 to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy

      - name: Verify 3.9.6 r1 staged for owner only
        shell: bash
        run: |
          set -euo pipefail
          URL="https://salary-manager.alromaithi-3bo0d.workers.dev/api/health"
          BODY=""
          for i in $(seq 1 90); do
            BODY=$(curl -fsS --max-time 8 "${URL}?r396_check=$(date +%s)" || true)
            if [[ "$BODY" == *'"version":"3.9.6"'* && "$BODY" == *'"stagedReleaseId":"3.9.6-history-payday-order-r1"'* ]]; then
              break
            fi
            sleep 4
          done
          [[ "$BODY" == *'"stagedReleaseId":"3.9.6-history-payday-order-r1"'* ]]
          [[ "$BODY" == *'"publishedReleaseId":"3.9.3-autoapprove-sync-race-r7"'* ]]
          [[ "$BODY" == *'"published":false'* ]]

      - name: Verify public users remain on approved stable release
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 15 "https://salary-manager.alromaithi-3bo0d.workers.dev/?public_r396_check=$(date +%s)" -o /tmp/public-r4.html
          grep -Fq '3.9.3-autoapprove-sync-race-r7' /tmp/public-r4.html
          if grep -Fq '3.9.6-history-payday-order-r1' /tmp/public-r4.html; then
            echo "SECURITY FAILURE: staged r4 leaked to public users" >&2
            exit 1
          fi

      - name: Summary
        shell: bash
        run: |
          echo "### Salary Manager 3.9.6 · History + Payday Order r1" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Previous-month operations can be approved after entering a new month" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ They remain in the correct historical statement and carry their cash effect forward" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Payday order is explicit: carry decision → salary → loans/instalments" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Salary bank messages cannot be counted before the payday carry decision" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Owner gets staged r4 first; public users remain on approved r7 until owner publishes" >> "$GITHUB_STEP_SUMMARY"
