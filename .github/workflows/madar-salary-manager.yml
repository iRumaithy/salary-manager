name: Salary-Manager — Madar automatic approval
run-name: Salary-Manager — ${{ github.event_name }}

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'scripts/**'
      - '**.md'
      - '**.txt'
  schedule:
    - cron: '4-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salary-manager-madar-${{ github.event_name == 'push' && github.sha || 'publisher' }}
  cancel-in-progress: false

env:
  OWNER_HUB_URL: https://owner-hub-rumaithy.alromaithi-3bo0d.chatgpt.site
  OWNER_HUB_APP_ID: salary-manager

jobs:
  candidate:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Prepare built-in Madar helpers
        shell: bash
        run: |
          node <<'MADAR_HELPERS'
          const fs=require('node:fs');fs.mkdirSync('scripts',{recursive:true});const files={"madar-proof.mjs": "const decode=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4)),c=>c.charCodeAt(0));\nexport async function verifyProof(token,publicKey,appId,repository){\n if(typeof token!=='string'||token.length>22000)throw Error('Unauthorized');\n const parts=token.split('.');if(parts.length!==3)throw Error('Unauthorized');\n const [header,payload,signature]=parts;let h,p;\n try{h=JSON.parse(new TextDecoder().decode(decode(header)));p=JSON.parse(new TextDecoder().decode(decode(payload)));}catch{throw Error('Unauthorized');}\n if(h.alg!=='ES256'||h.typ!=='JWT')throw Error('Unauthorized');\n const key=await crypto.subtle.importKey('jwk',publicKey,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);\n if(!await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,decode(signature),new TextEncoder().encode(header+'.'+payload)))throw Error('Unauthorized');\n const now=Math.floor(Date.now()/1000);\n if(p.iss!=='https://owner-hub-rumaithy.alromaithi-3bo0d.chatgpt.site'||p.aud!==appId+'-madar-release'||p.appId!==appId||p.repository!==repository||!/^\\d+(?:\\.\\d+){1,2}(?:-[A-Za-z0-9._-]+)?$/.test(p.version)||!(/^[a-f0-9]{40}$/).test(p.commitSha)||typeof p.notes!=='string'||p.notes.length>8000||typeof p.iat!=='number'||typeof p.exp!=='number'||p.iat>now+5||p.exp<=now||p.exp>p.iat+90||now-p.iat>90||typeof p.dryRun!=='boolean')throw Error('Unauthorized');\n return p;\n}\nexport function compareVersions(a,b){const x=a.split('.').map(Number),y=b.split('.').map(Number);for(let i=0;i<3;i++){if(x[i]!==y[i])return x[i]>y[i]?1:-1;}return 0;}\n", "verify-madar-deployment.mjs": "const url=new URL(process.env.SITE_URL||'');\nif(url.protocol!=='https:')throw Error('Missing HTTPS Pages URL');\nconst manifestUrl=new URL('madar-release.json?verify='+Date.now(),url.href.endsWith('/')?url:new URL(url.href+'/'));\nconst r=await fetch(manifestUrl,{cache:'no-store',redirect:'error',signal:AbortSignal.timeout(20000)});\nif(!r.ok)throw Error('Could not confirm the live Pages release');\nconst value=await r.json();\nif(value.commit!==process.env.RELEASE_COMMIT||value.version!==process.env.RELEASE_VERSION)throw Error('Live Pages files do not match the approved version. Activation blocked; retry after the CDN refreshes.');\nconsole.log('Live Pages release matches the approved commit and version.');\n", "prepare-madar-worker.mjs": "import {readFileSync,writeFileSync} from 'node:fs';\nimport {execFileSync} from 'node:child_process';\nconst sha=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();\nif(sha!==process.env.RELEASE_COMMIT)throw Error('Reviewed source mismatch');\nlet source=readFileSync('src/worker.js','utf8');\nif(source.includes('MADAR_SOURCE_COMMIT'))throw Error('Unexpected existing bridge; review before replacing');\nconst outer=\"  if (p === \\\"/api/madar/publish\\\" && request.method === \\\"POST\\\") {\\n    let proof;\\n    try { proof = await verifyMadarProof((request.headers.get(\\\"Authorization\\\") || \\\"\\\").replace(/^Bearer /,\\\"\\\"), MADAR_PUBLIC_KEY, \\\"salary-manager\\\", \\\"iRumaithy/salary-manager\\\"); }\\n    catch { return apiJson(request, env, {ok:false}, 401); }\\n    if (proof.commitSha !== MADAR_SOURCE_COMMIT || proof.version !== RELEASE_ID || proof.dryRun) return apiJson(request, env, {ok:false,error:\\\"SOURCE_MISMATCH\\\"}, 409);\\n    const {response, body} = await internal(env, \\\"/auth/system/madar-publish\\\", {version:VERSION,releaseId:RELEASE_ID,previousVersion:PREVIOUS_PUBLISHED_VERSION,previousReleaseId:PREVIOUS_RELEASE_ID,subject:url.origin});\\n    if (!response.ok || !body?.ok || body.publishedReleaseId !== RELEASE_ID) return apiJson(request, env, {ok:false}, 502);\\n    return apiJson(request, env, {ok:true,version:RELEASE_ID}, 200);\\n  }\\n\",internal=\"    if (p === \\\"/auth/system/madar-publish\\\") {\\n      const state = await this.ensureReleaseState(b.version, b.previousVersion, b.subject, false, b.releaseId, b.previousReleaseId);\\n      const version = String(state.stagedVersion || b.version || VERSION).slice(0, 30);\\n      const releaseId = String(state.stagedReleaseId || b.releaseId || RELEASE_ID).slice(0, 80);\\n      if (!version || !releaseId) return json({ ok: false, error: \\\"INVALID_VERSION\\\" }, 400);\\n      if (state.publishedReleaseId === releaseId) return json({ ok: true, alreadyPublished: true, ...state });\\n      const publishedAt = Date.now();\\n      await this.ctx.storage.put(\\\"release:publishedVersion\\\", version);\\n      await this.ctx.storage.put(\\\"release:publishedReleaseId\\\", releaseId);\\n      await this.ctx.storage.put(\\\"release:publishedAt\\\", publishedAt);\\n      await this.ctx.storage.delete(\\\"release:rejectedVersion\\\");\\n      await this.ctx.storage.delete(\\\"release:rejectedReleaseId\\\");\\n      await this.ctx.storage.delete(\\\"release:rejectedAt\\\");\\n      await this.ctx.storage.put(\\\"push:lastUpdateVersion\\\", version);\\n      await this.ctx.storage.put(\\\"push:lastUpdateReleaseId\\\", releaseId);\\n      const payload = {\\n        title: \\\"\\u062a\\u062d\\u062f\\u064a\\u062b \\u062c\\u062f\\u064a\\u062f \\u0645\\u062a\\u0648\\u0641\\u0631 \\u00b7 \\u0645\\u062f\\u064a\\u0631 \\u0627\\u0644\\u0631\\u0627\\u062a\\u0628\\\",\\n        body: `\\u062a\\u0645 \\u0627\\u0639\\u062a\\u0645\\u0627\\u062f \\u0627\\u0644\\u0625\\u0635\\u062f\\u0627\\u0631 ${version}. \\u0627\\u0641\\u062a\\u062d \\u0645\\u062f\\u064a\\u0631 \\u0627\\u0644\\u0631\\u0627\\u062a\\u0628 \\u062b\\u0645 \\u0627\\u062e\\u062a\\u0631 \\u0648\\u0642\\u062a \\u0627\\u0644\\u062a\\u062d\\u062f\\u064a\\u062b \\u0627\\u0644\\u0645\\u0646\\u0627\\u0633\\u0628 \\u0644\\u0643.`,\\n        icon: \\\"./icons/choice/gold-192.png\\\",\\n        badge: \\\"./icons/choice/gold-192.png\\\",\\n        url: \\\"./?update=1\\\",\\n        tag: `salary-manager-update-${releaseId}`\\n      };\\n      const result = await this.sendPushToPrefix(\\\"push:all:\\\", payload, b.subject);\\n      await this.audit(\\\"release-published-to-users\\\", { version, releaseId, adminId: \\\"madar-approved-release\\\", sent: result.sent, removed: result.removed, subscriptionCount: result.subscriptionCount });\\n      return json({ ok: true, stagedVersion: version, stagedReleaseId: releaseId, publishedVersion: version, publishedReleaseId: releaseId, published: true, publishedAt, ...result });\\n    }\\n\";\nif(!source.includes('  const p = url.pathname;')||!source.includes('    const admin = await this.getSession(String(b.token || \"\"));'))throw Error('Worker structure changed; review adapter');\nsource=\"import {verifyProof as verifyMadarProof} from '../scripts/madar-proof.mjs';\\nconst MADAR_PUBLIC_KEY=\"+\"{\\\"key_ops\\\":[\\\"verify\\\"],\\\"ext\\\":true,\\\"kty\\\":\\\"EC\\\",\\\"x\\\":\\\"st8pVU0Y1id0QzV8QLdIdh4rSDU3WJcPJnjNTd84QwA\\\",\\\"y\\\":\\\"GC3TzLjAMnsdLF3PDiNIGVQynQLu4IrntE363qLzipo\\\",\\\"crv\\\":\\\"P-256\\\"}\"+\";\\nconst MADAR_SOURCE_COMMIT=\"+JSON.stringify(sha)+\";\\n\"+source;\nsource=source.replace('  const p = url.pathname;','  const p = url.pathname;\\n'+outer);\nsource=source.replace('    const admin = await this.getSession(String(b.token || \"\"));',internal+'\\n    const admin = await this.getSession(String(b.token || \"\"));');\nsource=source.replace('const defaults = [current,','const defaults = [current, \"https://madar-spot-preview.alromaithi-3bo0d.chatgpt.site\",');\nwriteFileSync('src/worker.js',source);\n", "madar-auto.mjs": "// No interactive inputs or GitHub PAT. Secrets are used only for Madar requests.\nimport {execFileSync} from 'node:child_process';\nimport {readFileSync,existsSync,appendFileSync} from 'node:fs';\nconst git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();\nconst sha=git('rev-parse','HEAD'),mode=process.argv[2];\nfunction output(key,value){if(!/^[a-z_]+$/.test(key)||/[\\r\\n]/.test(String(value)))throw Error('Invalid output');appendFileSync(process.env.GITHUB_OUTPUT,key+'='+value+'\\n');}\nfunction required(key){if(!process.env[key])throw Error('Missing '+key);return process.env[key];}\nasync function request(path,body){const origin=new URL(required('OWNER_HUB_URL'));if(origin.protocol!=='https:'||origin.username||origin.password)throw Error('Invalid Madar URL');const u=new URL('/api/integration/'+path,origin);if(!body&&!u.searchParams.has('appId'))u.searchParams.set('appId',required('OWNER_HUB_APP_ID'));const r=await fetch(u,{method:body?'POST':'GET',redirect:'error',signal:AbortSignal.timeout(30000),headers:{Authorization:'Bearer '+required('OWNER_HUB_TOKEN'),'OAI-Sites-Authorization':'Bearer '+required('OWNER_HUB_SITE_ACCESS'),...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error('Madar HTTP '+r.status);return r.json();}\ntry{\n if(required('OWNER_HUB_APP_ID')!==\"salary-manager\")throw Error('Wrong app');\n if(mode==='check'){const u='gate?appId='+required('OWNER_HUB_APP_ID')+'&version='+encodeURIComponent(required('RELEASE_VERSION'))+'&commit='+required('RELEASE_COMMIT');if((await request(u)).allowed!==true)throw Error('Release is not approved');}\n else if(mode==='preflight'||mode==='complete'){const result=await request(mode,{appId:required('OWNER_HUB_APP_ID'),version:required('RELEASE_VERSION'),commitSha:required('RELEASE_COMMIT')});if(result.ok!==true)throw Error('Publication not confirmed');}\n else if(mode==='submit'){\n  const version=readFileSync('src/worker.js','utf8').match(/const RELEASE_ID\\s*=\\s*['\"]([^'\"]+)['\"]/)?.[1];\n  if(!/^\\d+\\.\\d+\\.\\d+(?:-[A-Za-z0-9._-]+)?$/.test(version||''))throw Error('Invalid RELEASE_ID');\n  const message=git('show','-s','--format=%B','HEAD'),title=message.split('\\n')[0].slice(0,200)||'تحديث Salary-Manager '+version;\n  const changed=git('diff-tree','--root','--no-commit-id','--name-only','-r',sha).split('\\n').filter(x=>!x.startsWith('.')&&!x.startsWith('scripts/')).slice(0,60);\n  const notes=existsSync('RELEASE-NOTES.md')?readFileSync('RELEASE-NOTES.md','utf8').trim():message+'\\n\\nالملفات المتغيرة:\\n'+changed.join('\\n');\n  const result=await request('candidate',{appId:'salary-manager',version,commitSha:sha,title,changes:notes.slice(0,10000),automatic:true});if(result.ok!==true)throw Error('Candidate not accepted');\n  output('version',version);output('commit',sha);console.log('Private immutable preview linked; candidate submitted.');\n }else if(mode==='approved'){\n  const result=await request('next-publication');\n  if(result.ready!==true){output('ready','false');console.log('No approved release awaiting publication.');}\n  else{if(!/^\\d+(?:\\.\\d+){1,2}(?:-[A-Za-z0-9._-]+)?$/.test(result.version)||!/^[a-f0-9]{40}$/.test(result.commit))throw Error('Invalid publication response');output('ready','true');output('version',result.version);output('commit',result.commit);}\n }else throw Error('Use submit or approved');\n}catch(error){console.error(error.message);process.exit(1);}\n", "prepare-madar-site.mjs": "import {execFileSync} from 'node:child_process';\nimport {readFileSync,writeFileSync,mkdirSync,cpSync,rmSync,lstatSync} from 'node:fs';\nconst sha=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();\nif(sha!==process.env.RELEASE_COMMIT)throw Error('Reviewed commit mismatch');\nconst version=process.env.RELEASE_VERSION;if(!version)throw Error('Missing version');\nrmSync('_site',{recursive:true,force:true});mkdirSync('_site');\nconst files=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\\0').filter(Boolean);\nfor(const path of files){if(path.split('/').some(x=>x.startsWith('.'))||/^(scripts|src|docs|tests|integrations)\\//.test(path)||/\\.(md|txt|sql|yml|yaml|map)$/.test(path)||path==='package.json'||path.includes('lock.'))continue;if(lstatSync(path).isSymbolicLink())throw Error('Symlink blocked');mkdirSync('_site/'+path.split('/').slice(0,-1).join('/'),{recursive:true});cpSync(path,'_site/'+path);}\nwriteFileSync('_site/madar-release.json',JSON.stringify({version,commit:sha}));writeFileSync('_site/.nojekyll','');\n", "madar-public-key.json": "{\"key_ops\":[\"verify\"],\"ext\":true,\"kty\":\"EC\",\"x\":\"st8pVU0Y1id0QzV8QLdIdh4rSDU3WJcPJnjNTd84QwA\",\"y\":\"GC3TzLjAMnsdLF3PDiNIGVQynQLu4IrntE363qLzipo\",\"crv\":\"P-256\"}\n"};for(const [name,content] of Object.entries(files))fs.writeFileSync('scripts/'+name,content);
