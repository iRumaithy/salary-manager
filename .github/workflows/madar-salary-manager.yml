      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate accounting, concurrency, and release isolation
        run: |
          npm run check
          npm test
      - name: Automatically prepare private review from this exact commit
        run: node scripts/madar-auto.mjs submit
        env:
          OWNER_HUB_TOKEN: ${{ secrets.OWNER_HUB_TOKEN }}
          OWNER_HUB_SITE_ACCESS: ${{ secrets.OWNER_HUB_SITE_ACCESS }}

