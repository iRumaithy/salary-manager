        run: node scripts/madar-auto.mjs preflight
        env:
          OWNER_HUB_TOKEN: ${{ secrets.OWNER_HUB_TOKEN }}
          OWNER_HUB_SITE_ACCESS: ${{ secrets.OWNER_HUB_SITE_ACCESS }}
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Bind exact approved source to the signed publication endpoint
        run: node scripts/prepare-madar-worker.mjs
      - name: Check Worker syntax
        run: node --check src/worker.js
      - name: Recheck approval immediately before Worker deployment
        run: node scripts/madar-auto.mjs check
        env:
          OWNER_HUB_TOKEN: ${{ secrets.OWNER_HUB_TOKEN }}
          OWNER_HUB_SITE_ACCESS: ${{ secrets.OWNER_HUB_SITE_ACCESS }}
      - name: Deploy exact approved Worker and assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
      - name: Activate only this approved release and record publication
        run: node scripts/madar-auto.mjs complete
        env:
          OWNER_HUB_TOKEN: ${{ secrets.OWNER_HUB_TOKEN }}
          OWNER_HUB_SITE_ACCESS: ${{ secrets.OWNER_HUB_SITE_ACCESS }}
